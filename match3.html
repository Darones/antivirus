<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<title>Антивирус — Match-3</title>
<style>
  :root{
    --bg-1:#eef2f7; --bg-2:#d9e2ec;
    --panel:#ffffff; --panel-2:#f8fafc; --border:#cbd5e1; --border-2:#e2e8f0;
    --text:#0f172a; --muted:#64748b; --accent:#6366f1; --yellow:#f59e0b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100dvh;width:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    color:var(--text);background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
    overflow:hidden;user-select:none;-webkit-user-select:none;
  }
  .app{margin:0 auto;width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:4px; padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:calc(env(safe-area-inset-bottom) + 4px);box-sizing:border-box;align-items:center;overflow:hidden}
  .top-bar{
    flex-shrink:0;
    display:grid;grid-template-columns:repeat(6,1fr);gap:3px;width:100%;
    padding:7px 5px;background:var(--panel);border:1px solid var(--border-2);
    border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,.05);
  }
  .stat{display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:0}
  #pauseBtn{width:34px;height:34px;padding:0;border:1px solid var(--border);border-radius:10px;background:#f1f5f9;color:var(--text);font-size:18px;font-weight:800;cursor:pointer}
  #pauseBtn:disabled{opacity:.45;cursor:default}
  .stat strong{font-size:14px;font-weight:800;white-space:nowrap}
  .stat small{font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .canvas-wrap{
    position:relative;width:100%;max-width:400px;
    flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    padding-right:52px;min-width:0;
  }
  canvas#board{
  display:block; width:100%; height:100%; max-width:100%; max-height:100%;
    background:#fff;border:3px solid var(--border);border-radius:20px;
    box-shadow:0 8px 28px rgba(15,23,42,.12);
    touch-action:none;
    transition:box-shadow .15s, border-color .15s;
  }
  canvas#board.armed{
    border-color:#ef4444;
    box-shadow:0 0 0 3px rgba(239,68,68,.3), 0 8px 28px rgba(15,23,42,.12);
  }
  .bomb-panel{
    flex-shrink:0;
    display:flex;gap:8px;width:100%;max-width:400px;
  }
  .bomb-btn, .ad-bomb-btn{
    flex:1;padding:12px 8px;border-radius:12px;
    border:2px solid #cbd5e1;background:#fff;
    font-size:14px;font-weight:800;color:var(--text);
    cursor:pointer;font-family:inherit;
    transition:transform .08s, background .15s, border-color .15s, color .15s;
  }
  .bomb-btn:active, .ad-bomb-btn:active{transform:scale(.97)}
  .bomb-btn:disabled{opacity:.45;cursor:default}
  .bomb-btn.active{
    background:linear-gradient(135deg,#f43f5e,#e11d48);
    border-color:#be123c;color:#fff;
  }
  .ad-bomb-btn{
    background:linear-gradient(135deg,#d1fae5,#a7f3d0);
    border-color:#34d399;color:#065f46;
  }
  #exitBtn{
    flex:1;padding:12px 8px;border:2px solid #94a3b8;border-radius:12px;
    font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .virus-column{
    position:absolute;right:0;top:8%;
    display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  .friend{
    width:48px;height:60px;
    transform-origin:50% 92%;
    animation:av-idle 2.6s ease-in-out infinite;
    filter:drop-shadow(0 4px 3px rgba(15,23,42,.18));
    will-change:transform,opacity;
  }
  .friend:nth-child(2){animation-delay:-.85s}
  .friend:nth-child(3){animation-delay:-1.7s}
  .friend svg{display:block;width:100%;height:100%;overflow:visible}
  .friend .av-happy{opacity:1}
  .friend .av-shock{opacity:0}
  .friend.hurt{animation:av-eliminate 1s cubic-bezier(.5,0,.7,1) both}
  .friend.hurt .av-happy{opacity:0}
  .friend.hurt .av-shock{opacity:1}
  @keyframes av-idle{
    0%,100%{transform:translateY(0) rotate(-3deg)}
    50%{transform:translateY(-5px) rotate(4deg)}
  }
  @keyframes av-eliminate{
    0%   {transform:translateX(0) scale(1); opacity:1}
    8%   {transform:translateX(-3px) scale(1.05); opacity:1}
    12%  {transform:translateX(3px) scale(1.05)}
    16%  {transform:translateX(-3px) scale(1.05)}
    20%  {transform:translateX(3px) scale(1.05)}
    24%  {transform:translateX(-2px) scale(1.04)}
    28%  {transform:translateX(2px) scale(1.04)}
    32%  {transform:translateX(-2px) scale(1.03)}
    36%  {transform:translateX(2px) scale(1.03)}
    40%  {transform:translateX(0) scale(1.02)}
    50%  {transform:translateX(0) scale(1.1); opacity:1}
    62%  {transform:translateX(0) scale(0.85); opacity:1}
    78%  {transform:translateX(0) scale(0.3) rotate(15deg); opacity:.7}
    90%  {transform:translateX(0) scale(0.05) rotate(-10deg); opacity:0}
    91%  {transform:scale(1.1); opacity:0}
    100% {transform:scale(1); opacity:1}
  }
  @media (max-width:380px){
    .canvas-wrap{padding-right:44px}
    .friend{width:40px;height:50px}
    .bomb-panel{gap:4px}
    .bomb-btn,.ad-bomb-btn,#exitBtn{font-size:12px;padding:10px 3px}
  }
  @media (prefers-reduced-motion:reduce){
    .friend{animation:none!important}
    .friend.hurt{animation:av-flash .6s ease both!important}
    @keyframes av-flash{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
  }
  .overlay{
    position:fixed;inset:0;z-index:10;display:grid;place-items:center;
    padding:16px;background:rgba(15,23,42,.55);backdrop-filter:blur(8px);
  }
  .overlay[hidden]{display:none!important}
  .dialog{
    width:min(100%,380px);padding:22px;text-align:center;
    border-radius:20px;background:var(--panel);
    box-shadow:0 12px 40px rgba(15,23,42,.15);
    border:1px solid var(--border-2);
  }
  .dialog h2{margin:0 0 8px;font-size:22px}
  .dialog p{line-height:1.5;color:var(--muted);margin:6px 0 14px;font-size:14px}
  .dialog .score-big{font-size:34px;font-weight:900;color:var(--accent);margin:6px 0}
  .overlay-buttons{display:grid;gap:8px;margin-top:10px}
  .overlay-buttons button{
    width:100%;padding:13px;border-radius:14px;border:none;
    background:linear-gradient(135deg,#6366f1,#ec4899);
    color:#fff;font-size:15px;font-weight:800;cursor:pointer;
    box-shadow:0 4px 16px rgba(99,102,241,.35);
    font-family:inherit;
  }
  .overlay-buttons button.secondary{
    background:var(--panel);
    color:var(--text);
    border:2px solid var(--border-2);
    box-shadow:none;
  }
  .overlay-buttons button:active{transform:scale(.98)}
  .deadlock-overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(15,23,42,.68);backdrop-filter:blur(8px)}
  .deadlock-overlay[hidden]{display:none!important}
  .deadlock-dialog{width:min(100%,380px);padding:22px;text-align:center;border-radius:20px;background:var(--panel);box-shadow:0 12px 40px rgba(15,23,42,.25);border:1px solid var(--border-2)}
  .deadlock-dialog h2{margin:0 0 8px;font-size:22px}
  .deadlock-dialog p{line-height:1.5;color:var(--muted);margin:6px 0 14px;font-size:14px}
  .deadlock-buttons{display:grid;gap:8px;margin-top:10px}
  .deadlock-buttons button{width:100%;padding:13px;border-radius:14px;border:0;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(99,102,241,.35);font-family:inherit}
  .deadlock-buttons button.secondary{background:var(--panel);color:var(--text);border:2px solid var(--border-2);box-shadow:none}
  .deadlock-buttons button:active{transform:scale(.98)}
  .tutorial{
    position:fixed;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(15,23,42,.6);
    backdrop-filter:blur(6px);
  }
  .tutorial[hidden]{display:none!important}
  .tutorial-dialog{
    width:min(100%,380px);padding:26px;text-align:center;
    border-radius:20px;background:var(--panel);
    box-shadow:0 12px 40px rgba(15,23,42,.25);
    border:1px solid var(--border-2);
  }
  .tutorial-dialog h2{margin:0 0 12px;font-size:24px}
  .tutorial-dialog p{line-height:1.55;color:#334155;margin:6px 0 20px;font-size:15px}
  .tutorial-dialog button{
    width:100%;padding:14px;border-radius:14px;border:none;
    background:linear-gradient(135deg,#6366f1,#ec4899);
    color:#fff;font-size:16px;font-weight:800;cursor:pointer;
    box-shadow:0 4px 16px rgba(99,102,241,.35);
    font-family:inherit;
  }
  .tutorial-dialog button:active{transform:scale(.98)}
  .pause-screen{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(15,23,42,.62);backdrop-filter:blur(8px)}
  .pause-screen[hidden]{display:none!important}
  .pause-dialog{width:min(100%,380px);padding:24px;border-radius:20px;background:var(--panel);border:1px solid var(--border-2);box-shadow:0 12px 40px rgba(15,23,42,.25)}
  .pause-dialog h2{margin:0 0 18px;text-align:center;font-size:24px}
  .volume-control{display:grid;gap:8px;margin:16px 0;color:var(--text);font-weight:700;font-size:14px}
  .volume-control input{width:100%;accent-color:var(--accent)}
  .pause-actions{display:grid;gap:8px;margin-top:20px}
  .pause-actions button{width:100%;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;font:800 15px inherit;font-family:inherit;cursor:pointer}
  .pause-actions button.secondary{background:#cbd5e1;color:#0f172a}
  .boss-avatar{position:absolute;top:8px;right:8px;width:72px;height:72px;pointer-events:none;z-index:5;opacity:.9;transition:transform .2s}
  .boss-avatar[hidden]{display:none!important}
  .boss-avatar.attacking{animation:boss-attack-anim .6s ease-out}
  @keyframes boss-attack-anim{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.3) rotate(-8deg)}50%{transform:scale(1.3) rotate(8deg)}75%{transform:scale(1.1) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}
  .boss-attack-banner{position:absolute;z-index:8;top:24%;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,#fecaca,#facc15);border:2px solid #dc2626;color:#7f1d1d;font-size:18px;font-weight:900;text-align:center;white-space:nowrap;box-shadow:0 6px 22px #7f1d1d66;animation:boss-banner-in .2s ease-out}
  .boss-attack-banner.fade-out{opacity:0;transition:opacity .2s ease}
  @keyframes boss-banner-in{from{opacity:0;top:18%}to{opacity:1;top:24%}}
  .level-map-screen{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;gap:12px;padding:16px;background:linear-gradient(180deg,var(--bg-1),var(--bg-2));overflow:auto}
  .level-map-screen[hidden]{display:none!important}
  .level-map-header{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:400px;width:100%;margin:0 auto}
  .level-map-header h1{font-size:22px;margin:0}
  .level-map-actions{display:flex;gap:8px}
  .level-map-actions button{padding:9px 12px;border:0;border-radius:10px;font:700 14px inherit;font-family:inherit;cursor:pointer;background:#6366f1;color:white}
  .levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0;width:100%;max-width:400px;margin:0 auto}
  .levels button{padding:10px 2px;border-radius:12px;border:1px solid var(--border-2);background:var(--panel-2);font-weight:800;font-size:15px;color:var(--text);cursor:pointer;font-family:inherit}
  .levels button:active{transform:scale(.95)}
  .levels button:disabled{opacity:.4;cursor:not-allowed}
  .levels small{display:block;font-size:10px;color:var(--yellow);margin-top:3px;font-weight:700}
  .level-map-back{display:block;width:100%;max-width:400px;margin:0 auto;padding:12px;border:1px solid var(--border-2);border-radius:12px;background:var(--panel);color:var(--text);font:800 15px inherit;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="level-map-screen" id="levelMapScreen" hidden>
  <div class="level-map-header"><h1>Карта уровней</h1><div class="level-map-actions"><button id="shopLink" type="button">Магазин</button><button id="dailyLink" type="button">Бонус</button></div></div>
  <div class="levels" id="levelGrid"></div>
  <button class="level-map-back" id="levelMapBack" type="button">Назад</button>
</div>
<div class="app" id="gameApp" hidden>
  <div class="top-bar">
    <div class="stat"><strong id="moves">32</strong><small>Ходы</small></div>
    <div class="stat"><strong id="score">0</strong><small>Очки</small></div>
    <div class="stat"><strong id="coins">0</strong><small>Монеты</small></div>
    <div class="stat"><strong id="viruses">0</strong><small>Вирусов</small></div>
    <div class="stat"><strong id="level">1</strong><small>Уровень</small></div>
    <button id="pauseBtn" type="button" aria-label="Пауза" title="Пауза">⏸</button>
  </div>
  <div class="canvas-wrap">
    <canvas id="board" width="400" height="600"></canvas>
    <div id="bossAvatar" class="boss-avatar" hidden></div>
    <div class="virus-column" aria-hidden="true">
      <div class="friend"></div>
      <div class="friend"></div>
      <div class="friend"></div>
    </div>
  </div>
  <div class="bomb-panel">
    <button id="bombBtn" class="bomb-btn">💣 Бомба: <span id="bombCount">0</span></button>
    <button id="adBombBtn" class="ad-bomb-btn">📺 +3 бомбы за рекламу</button>
    <button id="exitBtn" style="background:#cbd5e1; color:#0f172a;" onclick="location.href='index.html?menu=1'"> В меню</button>
  </div>
</div>

<div class="deadlock-overlay" id="deadlockOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="deadlockTitle"><div class="deadlock-dialog"><h2 id="deadlockTitle">Нет ходов!</h2><p>Держи бомбу в подарок. Используй её, чтобы расчистить поле.</p><div class="deadlock-buttons"><button id="deadlockBombBtn" type="button">Использовать бомбу</button><button id="deadlockRestartBtn" class="secondary" type="button">Начать заново</button></div></div></div>
<div class="overlay" id="overlay" hidden>
  <div class="dialog">
    <h2 id="overlayTitle">Игра окончена</h2>
    <div class="score-big" id="finalScore">0</div>
    <p id="overlaySubtitle">Ходов не осталось</p>
    <div class="overlay-buttons" id="overlayButtons"></div>
  </div>
</div>

<div class="tutorial" id="tutorialScreen">
  <div class="tutorial-dialog">
    <h2>Как играть</h2>
    <p>Составьте линию из 3-х ячеек одного цвета, и она исчезнет вместе с вирусом!</p>
    <button id="startBtn">Начать игру</button>
  </div>
</div>

<div class="pause-screen" id="pauseScreen" hidden>
  <div class="pause-dialog">
    <h2>Пауза</h2>
    <label class="volume-control" for="musicSelect">Мелодия:</label>
    <select id="musicSelect">
      <option value="random">Рандом по уровням</option>
      <option value="0">Трек 1</option>
      <option value="1">Трек 2</option>
      <option value="2">Трек 3</option>
      <option value="3">Трек 4</option>
      <option value="4">Трек 5</option>
      <option value="5">Трек 6</option>
    </select>
    <label class="volume-control" for="musicVol">Громкость музыки <input id="musicVol" type="range" min="0" max="100" value="30"></label>
    <label class="volume-control" for="sfxVol">Громкость звуков <input id="sfxVol" type="range" min="0" max="100" value="50"></label>
    <label class="volume-control" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;">
      Вибрация <input id="vibeToggle" type="checkbox" style="width:20px; height:20px; accent-color:var(--accent);">
    </label>
    <div class="pause-actions">
      <button id="resumeBtn" type="button">Продолжить</button>
      <button type="button" class="secondary" onclick="location.href='index.html?menu=1'">В меню</button>
    </div>
  </div>
</div>
<audio id="bgMusic"></audio>

<script>
'use strict';
console.log('=== MATCH3 V2.0 ===');

try {
  if (window.vkBridge) {
    vkBridge.send('VKWebAppInit').catch(console.warn);
  }
} catch(e) { console.warn(e); }

async function showBanner() {
  if (!window.vkBridge) return;
  try {
    await vkBridge.send('VKWebAppShowBannerAd', { banner_location: 'top', height_type: 'small', orientation: 'vertical' });
  } catch(e) { console.warn('Banner error:', e); }
}
setTimeout(showBanner, 1000);

const W = 8, H = 12;
const CELL = 50;
const COLORS = ['#f43f5e', '#f59e0b', '#3b82f6'];
const POINTS_PER_PILL = 10;
const POINTS_PER_VIRUS = 50;
const COINS_PER_VIRUS = 1;
const VIRUS_MIN_ROW = 4;
const MAX_LEVEL = 100;
const START_BOMBS = 2;
const BOSS_LEVELS = {
  10:  { name: 'Ангинозус', color: '#ef4444' },
  20:  { name: 'Риновирус', color: '#94a3b8' },
  30:  { name: 'Пневмоний', color: '#10b981' },
  40:  { name: 'Гемолитикус', color: '#8b5cf6' },
  50:  { name: 'Энтеровирус', color: '#f97316' },
  60:  { name: 'Менингит', color: '#7c2d12' },
  70:  { name: 'Нейровирус', color: '#a855f7' },
  80:  { name: 'Кардиовирус', color: '#e11d48' },
  90:  { name: 'Гепатит', color: '#65a30d' },
  100: { name: 'Коронавирус', color: '#dc2626' }
};
function isBossLevel(level){return !!BOSS_LEVELS[level];}


const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const STATS_URL = 'https://antivirus-duel-server.relaxdev.ru/stats/event';
const Stats = (() => {
  const queue = [];
  const sessionId = Math.random().toString(36).slice(2, 10);
  const sessionStart = Math.floor(Date.now() / 1000);
  function track(ev, props) {
    queue.push(Object.assign({
      t: Math.floor(Date.now() / 1000),
      sessionId,
      playerId: 'match3_' + sessionId,
      platform: 'web',
      app: 'match3',
      ev
    }, props || {}));
    if(queue.length >= 20) flush();
  }
  function flush(beacon) {
    if(!queue.length) return;
    const body = JSON.stringify({events: queue.slice()});
    queue.length = 0;
    if(beacon && navigator.sendBeacon) {
      try { if(navigator.sendBeacon(STATS_URL, new Blob([body], {type:'text/plain'}))) return; } catch {}
    }
    try {
      fetch(STATS_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body, keepalive:true}).catch(()=>{});
    } catch {}
  }
  setInterval(flush, 20000);
  window.addEventListener('pagehide', () => flush(true));
  return {track, flush, sessionStart};
})();
Stats.track('session_start', {app:'match3'});

const bgMusic = document.getElementById('bgMusic');
const musicTracks = ['music/track1.mp3', 'music/track2.mp3', 'music/track3.mp3', 'music/track4.mp3', 'music/track5.mp3', 'music/track6.mp3'];
let currentMusicSetting = 'random';
let globalSfxVol = 0.5;
let isPaused = false;
let rafId = 0;
let _lastSync = 0;

// ==== Состояние ====
let grid = [];
let selected = null;
let score = 0;
let moves = 0;
let virusesLeft = 0;
let currentLevel = 1;
let maxLevel = 1;
let levelsCompleted = 0;
let bombs = Number(localStorage.getItem('antivirus-match3-bombs')) || START_BOMBS;
let vibeEnabled = localStorage.getItem('antivirus-match3-vibe') !== 'false';
let bombMode = false;
let coins = loadSharedCoins();
let earnedCoins = 0;
let gameOver = true;
let busy = true;
let deadlockOpen = false;
let bossActive = false;
let bossStartVirusCount = 0;
let bossWaveFired = [false, false, false];
let bossPhase = 0;
let particles = [];
let clock = 0;
let lastTime = performance.now();
const isWeb = /(^|_)web($|_)/.test(new URLSearchParams(location.search).get('vk_platform') || '') || location.protocol === 'file:' || !window.vkBridge;

function getSharedCoinsKey(){
  const params = new URLSearchParams(location.search);
  const client = (params.get('vk_client') || '').toLowerCase();
  const platform = (params.get('vk_platform') || '').toLowerCase();
  return client === 'ok' || platform.includes('ok') ? 'antivirus-ok-1' : 'antivirus-vk-1';
}
function loadSharedCoins(){
  try {
    const data = JSON.parse(localStorage.getItem(getSharedCoinsKey()) || 'null');
    const value = data && Object.prototype.hasOwnProperty.call(data, 'coins') ? Number(data.coins) : 0;
    if(Number.isFinite(value) && value > 0) return value;
  } catch {}
  try { const legacy = Number(localStorage.getItem('antivirus-match3-coins') || 0); if(Number.isFinite(legacy) && legacy > 0){ saveSharedCoins(legacy); localStorage.removeItem('antivirus-match3-coins'); return legacy; } } catch {}

let audio = null;

function initAudio(){
  if(!audio){
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    try { audio = new C(); } catch { return; }
  }
  if(audio.state === 'suspended') audio.resume().catch(()=>{});
}

function tone(freq, dur, type, vol, delay){
  if(!audio) return;
  type = type || 'sine';
  vol = (vol == null ? 0.12 : vol) * globalSfxVol;
  delay = delay || 0;
  try {
    const t0 = audio.currentTime + delay;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch {}
}

function sfxSwap(){ tone(400, 0.1, 'sine', 0.12); }
function sfxMatch(){
  tone(523, 0.10, 'sine', 0.12, 0.00);

}

function sfxWin(){ tone(523,0.15,'sine',0.15,0); tone(659,0.15,'sine',0.15,0.1); tone(784,0.2,'sine',0.15,0.2); tone(1047,0.3,'sine',0.15,0.3); }
function sfxLose(){ tone(330,0.2,'sawtooth',0.15,0); tone(277,0.2,'sawtooth',0.15,0.15); tone(220,0.4,'sawtooth',0.15,0.3); }

function getVirusCount(level){
  const base = 10;
  const growth = 25 * Math.sqrt(Math.min(level, 100) / 100);
  return Math.round(base + growth);
}

function createGrid(){
  grid = Array.from({length:H}, () => Array(W).fill(null));

  // 1) Заполняем пилюлями
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      grid[y][x] = { type: 'pill', color: randomColor(), dropOffset: 0 };
    }
  }

  // 2) Чистим стартовые совпадения (до вирусов)
  cleanInitialMatches();

  // 3) Расставляем вирусы
  const baseCount = getVirusCount(currentLevel);
  const virusCount = isBossLevel(currentLevel) ? Math.round(baseCount * 0.8) : baseCount;
  const candidates = [];
  for(let y=VIRUS_MIN_ROW;y<H;y++)
    for(let x=0;x<W;x++) candidates.push([x,y]);
  for(let i=candidates.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  const n = Math.min(virusCount, candidates.length);
  for(let i=0;i<n;i++){
    const [x,y] = candidates[i];
    grid[y][x] = { type: 'virus', color: randomColor() };
  }

  // 4) Чистим совпадения после вирусов (перекрашиваем только пилюли)
  cleanInitialMatches();

  virusesLeft = countViruses();
  if(isBossLevel(currentLevel)){
    bossActive=true;
    bossStartVirusCount=virusesLeft;
    bossWaveFired=[false,false,false];
    bossPhase=0;
  }else{
    bossActive=false;
  }
}

function cleanInitialMatches(){
  let guard = 1000;
  while(guard-- > 0){
    const m = findMatches();
    if(!m.length) break;
    for(const i of m){
      const x = i % W, y = Math.floor(i / W);
      const c = grid[y][x];
      if(!c || c.type === 'virus') continue;
      const colors = [0,1,2].filter(cc => cc !== c.color);
      c.color = colors[Math.floor(Math.random() * colors.length)];
    }
  }
}

function countViruses(){
  let n = 0;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++)
    if(grid[y][x] && grid[y][x].type === 'virus') n++;
  return n;
}

// ============================================================
// ПОИСК СОВПАДЕНИЙ: 3+ одного цвета, хотя бы одна пилюля в линии
// ============================================================
function findMatches(){
  const found = new Set();

  for(let y=0;y<H;y++){
    let runStart = 0;
    for(let x=1;x<=W;x++){
      const a = x < W ? grid[y][x] : null;
      const b = grid[y][runStart];
      const sameColor = !!(a && b && a.color === b.color);
      if(!sameColor){
        if(x - runStart >= 3){
          let hasPill = false;
          for(let k=runStart;k<x;k++){
            const c = grid[y][k];
            if(c && c.type === 'pill'){ hasPill = true; break; }
          }
          if(hasPill){
            for(let k=runStart;k<x;k++) found.add(y*W + k);
          }
        }
        runStart = x;
      }
    }
  }

  for(let x=0;x<W;x++){
    let runStart = 0;
    for(let y=1;y<=H;y++){
      const a = y < H ? grid[y][x] : null;
      const b = grid[runStart][x];
      const sameColor = !!(a && b && a.color === b.color);
      if(!sameColor){
        if(y - runStart >= 3){
          let hasPill = false;
          for(let k=runStart;k<y;k++){
            const c = grid[k][x];
            if(c && c.type === 'pill'){ hasPill = true; break; }
          }
          if(hasPill){
            for(let k=runStart;k<y;k++) found.add(k*W + x);
          }
        }
        runStart = y;
      }
    }
  }

  return [...found];
}

// ============================================================
// СВАП
// ============================================================
function swapCells(x1, y1, x2, y2){
  const tmp = grid[y1][x1];
  grid[y1][x1] = grid[y2][x2];
  grid[y2][x2] = tmp;
}

function hasAvailableMoves(){
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const cell=grid[y] && grid[y][x];
      if(!cell || cell.type !== 'pill') continue;
      const neighbors=[[x+1,y],[x,y+1]];
      for(const [nx,ny] of neighbors){
        if(nx>=W || ny>=H) continue;
        const neighbor=grid[ny] && grid[ny][nx];
        if(!neighbor || neighbor.type !== 'pill') continue;
        swapCells(x,y,nx,ny);
        const hasMatch=findMatches().length>0;
        swapCells(x,y,nx,ny);
        if(hasMatch) return true;
      }
    }
  }
  return false;
}

function handleSwap(x1, y1, x2, y2){
  const a = grid[y1][x1];
  const b = grid[y2][x2];
  if(!a || !b || a.type === 'virus' || b.type === 'virus') return false;

  swapCells(x1, y1, x2, y2);
  if(findMatches().length){
    sfxSwap();
    vibrate(15);
    moves--;
    updateHUD();
    busy = true;
    resolveCascades(0);
    return true;
  }
  swapCells(x1, y1, x2, y2);
  return false;
}

// ============================================================
// КАСКАД
// ============================================================
function resolveCascades(depth){
  if(depth > 30){ busy = false; checkWinOrLose(); updateHUD(); return; }

  const matches = findMatches();
  if(matches.length === 0){
    busy = false;
    if(virusesLeft <= 0 || moves <= 0){
      checkWinOrLose();
    } else if(!gameOver && !deadlockOpen){
      checkDeadlock();
    }
    updateHUD();
    return;
  }

  let virusCount = 0;
  const affectedColors = new Set();

  for(const i of matches){
    const x = i % W, y = Math.floor(i / W);
    const c = grid[y][x];
    if(!c) continue;

    if(c.type === 'virus'){
      score += POINTS_PER_VIRUS;
      virusesLeft--;
      earnedCoins += COINS_PER_VIRUS;
      virusCount++;
      spawnParticles(x, y, COLORS[c.color], 16);
    } else {
      score += POINTS_PER_PILL;
      spawnParticles(x, y, COLORS[c.color], 8);
    }
    affectedColors.add(c.color);
    grid[y][x] = null;
  }

  if(virusCount > 0) { sfxVirus(); vibrate([20, 30, 20]); }
  sfxMatch();

  if(virusesLeft < 0) virusesLeft = 0;
  animateAffectedViruses(affectedColors);
  updateHUD();
  if(bossActive) checkBossPhase();

  setTimeout(() => {
    applyGravity();
    fillEmpty();
    setTimeout(() => resolveCascades(depth + 1), 120);
  }, 160);
}

// ============================================================
// ГРАВИТАЦИЯ И ЗАЛИВКА
// ============================================================
function applyGravity(){
  for(let x=0;x<W;x++){
    let writeY = H - 1;
    for(let y=H-1;y>=0;y--){
      const c = grid[y][x];
      if(!c) continue;
      if(c.type === 'virus'){
        writeY = y - 1;
        continue;
      }
      if(y !== writeY){
        grid[writeY][x] = c;
        grid[y][x] = null;
        if(c.type === 'pill') c.dropOffset = (writeY - y) * CELL;
      }
      writeY--;
    }
  }
}

function fillEmpty(){
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      if(!grid[y][x]){
        grid[y][x] = { type: 'pill', color: randomColor(), dropOffset: (y + 1) * CELL };
      }
    }
  }
}

function triggerBomb(cx, cy){
  vibrate([50, 30, 50]);
  if(bombs <= 0) return;
  bombs--;
  saveBombs();
  bombMode = false;

  const minX = Math.max(0, cx - 1), maxX = Math.min(W - 1, cx + 1);
  const minY = Math.max(0, cy - 1), maxY = Math.min(H - 1, cy + 1);

  let virusCount = 0;
  const affectedColors = new Set();

  for(let y=minY; y<=maxY; y++){
    for(let x=minX; x<=maxX; x++){
      const c = grid[y][x];
      if(!c) continue;
      if(c.type === 'virus'){
        score += POINTS_PER_VIRUS;
        virusesLeft--;
        earnedCoins += COINS_PER_VIRUS;
        virusCount++;
        spawnParticles(x, y, COLORS[c.color], 16);
      } else {
        score += POINTS_PER_PILL;
        spawnParticles(x, y, COLORS[c.color], 8);
      }
      affectedColors.add(c.color);
      grid[y][x] = null;
    }
  }

  if(virusCount > 0) sfxVirus();
  sfxMatch();

  if(virusesLeft < 0) virusesLeft = 0;
  animateAffectedViruses(affectedColors);
  busy = true;
  updateHUD();
  if(bossActive) checkBossPhase();

  setTimeout(() => {
    applyGravity();
    fillEmpty();
    setTimeout(() => resolveCascades(0), 120);
  }, 160);
}

// ============================================================
// КОНЕЦ ИГРЫ / УРОВНИ
// ============================================================
function checkWinOrLose(){
  if(virusesLeft <= 0){ win(); return; }
  if(moves <= 0){ lose(); return; }
}

function flushCoins(){
  const reward = earnedCoins;
  coins += reward;
  earnedCoins = 0;
  saveCoins();
  return reward;
}

function win(){
  sfxWin();
  gameOver = true;
  Stats.track('level_end', { level: currentLevel, won: true, app: 'match3' });
  levelsCompleted++;
  const reward = flushCoins();
  if(currentLevel === maxLevel && maxLevel < MAX_LEVEL) maxLevel++;
  saveLevelProgress();
  updateHUD();

  const isFinal = currentLevel >= MAX_LEVEL;
  document.getElementById('overlayTitle').textContent =

// ============================================================
// ЧАСТИЦЫ
// ============================================================
function spawnParticles(x, y, color, count){
  count = count || 8;
  const cx = x*CELL + CELL/2, cy = y*CELL + CELL/2;
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const s = 60 + Math.random()*120;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a)*s,
      vy: Math.sin(a)*s,
      life: 0.5 + Math.random()*0.3,
      maxLife: 0.8,
      color,
      size: 2 + Math.random()*3
    });
  }
}

function updateParticles(dt){
  for(const p of particles){
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 300 * dt;
  }
  particles = particles.filter(p => p.life > 0);
}

// ============================================================
// ОТРИСОВКА
// ============================================================
function shade(hex, amt){
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + v*amt)));
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2,'0')).join('');
}

function drawGem(x, y, color, offsetY){
  const px = x*CELL + CELL/2, py = y*CELL + CELL/2 - (offsetY || 0);
  const r = 19;
  ctx.save();
  const grad = ctx.createRadialGradient(px - r*0.35, py - r*0.35, r*0.15, px, py, r);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.25, color);
  grad.addColorStop(1, shade(color, -0.25));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(px, py, r, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath();
  ctx.ellipse(px - r*0.35, py - r*0.4, r*0.25, r*0.15, -Math.PI/4, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawVirus(x, y, color, time, offsetY){
  const px = x*CELL + CELL/2, py = y*CELL + CELL/2 - (offsetY || 0);
  const r = 14;
  const wobble = Math.sin(time*2 + x*0.7 + y*0.5) * 0.08;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(wobble);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.fillStyle = color;
  for(let i=0;i<8;i++){
    const a = i * Math.PI/4;
    const x1 = Math.cos(a)*r*0.9, y1 = Math.sin(a)*r*0.9;
    const x2 = Math.cos(a)*r*1.4, y2 = Math.sin(a)*r*1.4;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x2, y2, 2, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(-5, -3, 4.5, 0, Math.PI*2);
  ctx.arc(5, -3, 4.5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(-4, -2, 2, 0, Math.PI*2);
  ctx.arc(6, -2, 2, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(0, 4, 5, 0, Math.PI, false); ctx.stroke();
  ctx.restore();
}

function draw(){
  const g = ctx.createLinearGradient(0, 0, 0, 600);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(1, '#f1f5f9');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 400, 600);

  ctx.strokeStyle = 'rgba(100,116,139,.15)';
  ctx.lineWidth = 1;
  for(let x=1;x<W;x++){ ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, 600); ctx.stroke(); }
  for(let y=1;y<H;y++){ ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(400, y*CELL); ctx.stroke(); }

  if(grid && grid.length){
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        const c = grid[y][x];
        if(!c) continue;
        if(c.type === 'virus') drawVirus(x, y, COLORS[c.color], clock, 0);
        else drawGem(x, y, COLORS[c.color], c.dropOffset || 0);
      }
    }
  }

  if(selected){
    ctx.save();
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 4;
    ctx.setLineDash([8, 4]);
    ctx.strokeRect(selected.x*CELL + 3, selected.y*CELL + 3, CELL - 6, CELL - 6);
    ctx.restore();
  }

  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// ВВОД
// ============================================================
function cellFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  const style = getComputedStyle(canvas);
  const borderLeft = parseFloat(style.borderLeftWidth) || 0;
  const borderRight = parseFloat(style.borderRightWidth) || 0;
  const borderTop = parseFloat(style.borderTopWidth) || 0;
  const borderBottom = parseFloat(style.borderBottomWidth) || 0;
  const contentWidth = rect.width - borderLeft - borderRight;
  const contentHeight = rect.height - borderTop - borderBottom;
  if(contentWidth <= 0 || contentHeight <= 0) return null;
  const canvasX = (e.clientX - rect.left - borderLeft) * canvas.width / contentWidth;
  const canvasY = (e.clientY - rect.top - borderTop) * canvas.height / contentHeight;
  const x = Math.floor(canvasX / (canvas.width / W));
  const y = Math.floor(canvasY / (canvas.height / H));
  if(x < 0 || x >= W || y < 0 || y >= H) return null;
  return { x, y };
}

canvas.addEventListener('pointerdown', e => {
  if(gameOver || busy || isPaused) return;
  const cell = cellFromEvent(e);
  if(!cell) return;

  if(bombMode){
    triggerBomb(cell.x, cell.y);
    updateHUD();
    return;
  }

  const gem = grid[cell.y][cell.x];
  if(!gem) return;

  if(gem.type === 'virus'){
    selected = null;
    return;
  }

  if(!selected){ selected = cell; return; }
  if(selected.x === cell.x && selected.y === cell.y){ selected = null; return; }

  const adjacent = Math.abs(selected.x - cell.x) + Math.abs(selected.y - cell.y) === 1;
  if(adjacent){
    handleSwap(selected.x, selected.y, cell.x, cell.y);
    selected = null;
  } else {
    selected = cell;
  }
});

function syncButtonStates(){
  const pauseBtn = document.getElementById('pauseBtn');
  if(pauseBtn) pauseBtn.disabled = gameOver || busy || isPaused;
  const bombBtn = document.getElementById('bombBtn');
  if(bombBtn){
    bombBtn.disabled = bombs <= 0 || isPaused;
    bombBtn.classList.toggle('active', bombMode && bombs > 0);
  }
  canvas.classList.toggle('armed', bombMode && bombs > 0);
}
function frame(now){
  rafId = 0;
  if(isPaused || gameOver) return;
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  clock += dt;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const c=grid[y][x];
      if(c && c.type === 'pill' && c.dropOffset > 0){
        c.dropOffset -= 2000 * dt;
        if(c.dropOffset < 0) c.dropOffset = 0;
      }
    }
  }
  if(now - _lastSync > 500){
    _lastSync = now;
    syncButtonStates();
  }
  updateParticles(dt);
  draw();
  if(!isPaused && !gameOver) rafId = requestAnimationFrame(frame);
}

function renderLevelMap(){
  gameOver=true; busy=true;
  document.getElementById('levelMapScreen').hidden=false;
  document.getElementById('gameApp').hidden=true;

  const container = document.getElementById('levelGrid');
  container.innerHTML = '';

  for(let n=1; n<=MAX_LEVEL; n++){
    const locked = (n > maxLevel);
    const icon = locked ? '🔒' : n;

    // Прочерк внизу (как в старой игре), так как звезд у нас пока нет
    const starsHtml = '<small>—</small>';

    const btn = document.createElement('button');
    btn.innerHTML = String(icon) + starsHtml;
    btn.disabled = locked;

    btn.addEventListener('click', () => {
      if(locked) return;
      currentLevel = n;
      document.getElementById('levelMapScreen').hidden = true;
      document.getElementById('gameApp').hidden = false;
      initAudio();
      beginRound();
    });

    container.appendChild(btn);
  }
}
