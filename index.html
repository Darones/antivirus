<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eef2f7">
<link rel="icon" href="data:,">
<title>Антивирус</title>
<style>
:root{
  --bg-1:#eef2f7;--bg-2:#d9e2ec;--panel:#ffffff;--panel-2:#f8fafc;
  --border:#cbd5e1;--border-2:#e2e8f0;--text:#0f172a;--muted:#64748b;
  --accent:#6366f1;--accent-2:#ec4899;--yellow:#f59e0b;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 4px 16px rgba(15,23,42,.08);
  --shadow-lg:0 12px 40px rgba(15,23,42,.15);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  color:var(--text);background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
  overflow:hidden;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:var(--text);cursor:pointer;border:none;background:none;padding:0;touch-action:manipulation;font-family:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

.app{
  max-width:560px;margin:0 auto;
  height:100dvh;max-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 4px) 8px calc(env(safe-area-inset-bottom) + 6px);
  display:flex;flex-direction:column;gap:5px;overflow:hidden;
}

.duel-bar{
  display:flex;gap:10px;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  border:1px solid #f59e0b;border-radius:10px;
  padding:5px 10px;flex-shrink:0;
  font-size:12px;font-weight:800;color:#78350f;
}
.duel-opp-name{white-space:nowrap;flex:1}
.duel-opp-count{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px}

.mini-opp{
  grid-column:2;grid-row:1 / span 2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  border:2px solid #f59e0b;border-radius:16px;
  box-shadow:var(--shadow);padding:3px;
  min-height:104px;
  min-width:70px;
}
.mini-opp canvas{
  display:block;width:60px;height:90px;
  background:#fff;border-radius:3px;
  max-width:100%;max-height:100%;
}
body:not(.duel-mode) .mini-opp{display:none}

.menu-logo{
  display:block;
  width:min(100%,260px);
  height:auto;
  max-height:130px;
  margin:0 auto 6px;
  object-fit:contain;
}

.duel-toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(15,23,42,.9);color:#fff;padding:10px 18px;border-radius:99px;
  font-size:13px;font-weight:700;z-index:500;opacity:0;transition:.25s;
  pointer-events:none;backdrop-filter:blur(8px);max-width:80vw;text-align:center;
}
.duel-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.top-bar{
  display:grid;
  grid-template-columns:repeat(4,1fr) 34px 34px;
  gap:3px;padding:4px 5px;
  background:var(--panel);border:1px solid var(--border-2);
  border-radius:12px;box-shadow:var(--shadow-sm);
  align-items:center;flex-shrink:0;
}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0;overflow:hidden}
.stat strong{font-size:14px;font-weight:800;white-space:nowrap}
.stat small{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.icon-btn{
  width:34px;height:34px;border-radius:9px;
  background:var(--panel-2);border:1px solid var(--border-2);
  font-size:15px;display:flex;align-items:center;justify-content:center;
  color:var(--text);
}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{opacity:.4;cursor:default}

.preview-top{
  display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:32px;flex-shrink:0;
  font-size:10px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;
}
.preview{
  display:flex;align-items:center;padding:4px 8px;
  background:var(--panel);border:1px solid var(--border-2);
  border-radius:999px;box-shadow:var(--shadow-sm);min-height:26px;
}
.preview i{
  display:block;width:16px;height:16px;border-radius:50%;
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.15),inset 0 1px 2px rgba(255,255,255,.6);
}
.preview i + i{margin-left:-3px}

.board-area{flex:1;display:flex;flex-direction:column;min-height:0;gap:4px}
.canvas-wrap{
  flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding-right:52px;padding-left:2px;
}
.canvas-inner{
  position:relative;height:100%;max-height:100%;
  aspect-ratio:2/3;max-width:100%;
}
canvas#board{
  display:block;width:100%;height:100%;
  background:#fff;
  border:3px solid var(--border);
  border-radius:30px;
  box-shadow:0 8px 28px rgba(15,23,42,.12),inset 0 0 0 1px rgba(255,255,255,.5);
  touch-action:none;
}
.virus-column{
  position:absolute;left:100%;top:8%;
  margin-left:4px;
  display:flex;flex-direction:column;gap:16px;align-items:center;
}

.friend{
  width:48px;height:60px;
  transform-origin:50% 92%;
  animation:av-idle 2.6s ease-in-out infinite;
  filter:drop-shadow(0 4px 3px rgba(15,23,42,.18));
  will-change:transform,opacity;
}
.friend:nth-child(2){animation-delay:-.85s}
.friend:nth-child(3){animation-delay:-1.7s}
.friend svg{display:block;width:100%;height:100%;overflow:visible}
.friend .av-happy{opacity:1}
.friend .av-shock{opacity:0}
.friend.hurt{animation:av-eliminate 1s cubic-bezier(.5,0,.7,1) both}
.friend.hurt .av-happy{opacity:0}
.friend.hurt .av-shock{opacity:1}
body.stopped .friend{animation-play-state:paused}
@keyframes av-idle{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-5px) rotate(4deg)}
}
@keyframes av-eliminate{
  0%   {transform:translateX(0) scale(1); opacity:1}
  8%   {transform:translateX(-3px) scale(1.05); opacity:1}
  12%  {transform:translateX(3px) scale(1.05)}
  16%  {transform:translateX(-3px) scale(1.05)}
  20%  {transform:translateX(3px) scale(1.05)}
  24%  {transform:translateX(-2px) scale(1.04)}
  28%  {transform:translateX(2px) scale(1.04)}
  32%  {transform:translateX(-2px) scale(1.03)}
  36%  {transform:translateX(2px) scale(1.03)}
  40%  {transform:translateX(0) scale(1.02)}
  50%  {transform:translateX(0) scale(1.1); opacity:1}
  62%  {transform:translateX(0) scale(0.85); opacity:1}
  78%  {transform:translateX(0) scale(0.3) rotate(15deg); opacity:.7}
  90%  {transform:translateX(0) scale(0.05) rotate(-10deg); opacity:0}
  91%  {transform:scale(1.1); opacity:0}
  100% {transform:scale(1); opacity:1}
}
@media (prefers-reduced-motion:reduce){
  .friend{animation:none!important}
  .friend.hurt{animation:av-flash .6s ease both!important}
  @keyframes av-flash{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
}

.notice{
  min-height:16px;font-size:12px;font-weight:700;color:var(--accent);
  text-align:center;flex-shrink:0;
}

.controls-v2{
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto;
  gap:6px;width:100%;max-width:420px;margin:0 auto;flex-shrink:0;
}
.ctrl-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:16px;font-weight:800;color:var(--text);
  background:var(--panel);border:2px solid var(--border-2);
  box-shadow:var(--shadow);min-height:52px;
  font-size:24px;line-height:1;transition:transform .08s;
}
.ctrl-btn:active{transform:scale(.94);background:var(--panel-2)}
.ctrl-btn:disabled{opacity:.35}
.rotate-btn{
  grid-column:3;grid-row:1;min-height:48px;font-size:20px;
  background:linear-gradient(135deg,#e0e7ff,#c7d2fe);
  border-color:#a5b4fc;color:#3730a3;
}
.drop-btn{
  grid-column:1;grid-row:1;min-height:48px;font-size:22px;
  background:linear-gradient(135deg,#dbeafe,#bfdbfe);
  border-color:#93c5fd;color:#1e40af;
}
.ad-btn{
  grid-column:2;grid-row:1;min-height:48px;
  background:linear-gradient(135deg,#d1fae5,#a7f3d0);
  border-color:#34d399;color:#065f46;gap:0;
}
.ad-btn .ad-emoji{font-size:18px;line-height:1}
.ad-btn .ad-plus{font-size:9px;font-weight:900;margin-top:1px;line-height:1}
body.duel-mode .ad-btn{display:none}
body.no-rewarded-ads .ad-btn{display:none}
.left-btn{grid-column:1;grid-row:2}
.right-btn{grid-column:3;grid-row:2}
.bomb-btn{
  grid-column:2;grid-row:2;position:relative;
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  border-color:#f59e0b;color:#92400e;gap:0;
}
.bomb-emoji{font-size:20px;line-height:1}
.bomb-count{
  font-size:10px;font-weight:900;margin-top:1px;
  background:rgba(146,64,14,.14);border-radius:999px;
  padding:0 6px;color:#92400e;min-width:18px;
}
.bomb-btn.zero{opacity:.5}
.bomb-btn.firework{animation:bomb-pop .5s ease-out}
@keyframes bomb-pop{
  0%{transform:scale(1)}30%{transform:scale(1.18)}
  60%{transform:scale(.95)}100%{transform:scale(1)}
}
body.duel-mode .bomb-btn{display:none}

.footer{text-align:center;font-size:10px;color:var(--muted);line-height:1.3;flex-shrink:0}

.overlay{
  position:fixed;inset:0;z-index:10;display:grid;place-items:center;
  padding:15px;background:rgba(15,23,42,.55);
  backdrop-filter:blur(8px);overflow:auto;
}
.dialog{
  width:min(100%,460px);max-height:92dvh;overflow:auto;padding:24px;
  text-align:center;border-radius:24px;
  background:var(--panel);box-shadow:var(--shadow-lg);
  border:1px solid var(--border-2);
}
.dialog h2{margin:0 0 12px;font-size:22px}
.dialog p{line-height:1.5;color:var(--muted);margin:6px 0 14px;font-size:14px}
.stack{display:grid;gap:8px;margin:6px 0}
.stack button{
  border-radius:14px;border:1px solid var(--border-2);
  background:var(--panel-2);font-size:15px;font-weight:700;
  min-height:48px;padding:10px 14px;color:var(--text);
  transition:transform .08s;
}
.stack button:active{transform:scale(.98)}
.stack button.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;border-color:transparent;box-shadow:var(--shadow);
}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.levels button{
  padding:10px 2px;border-radius:12px;border:1px solid var(--border-2);
  background:var(--panel-2);font-weight:800;font-size:15px;
}
.levels button:active{transform:scale(.95)}
.levels button:disabled{opacity:.4}
.levels small{display:block;font-size:10px;color:var(--yellow);margin-top:3px;font-weight:700}
.row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:8px 0;border-bottom:1px solid var(--border-2);
  font-size:14px;font-weight:600;
}
.row:last-of-type{border-bottom:none}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);user-select:auto;-webkit-user-select:auto;pointer-events:auto;cursor:pointer}
.row input[type=range]{width:110px;accent-color:var(--accent)}
.row select{
  padding:6px 8px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel-2);max-width:170px;font-size:14px;
  user-select:auto;-webkit-user-select:auto;pointer-events:auto;cursor:pointer;
}
.status{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.shop-item{
  display:flex;align-items:center;gap:10px;padding:12px;
  background:var(--panel-2);border:1px solid var(--border-2);
  border-radius:14px;margin:6px 0;text-align:left;
}
.shop-item .icon{font-size:26px;flex-shrink:0}
.shop-item .info{flex:1;min-width:0}
.shop-item .info b{display:block;font-size:14px;margin-bottom:2px}
.shop-item .info small{color:var(--muted);font-size:12px;display:block;line-height:1.35}
.shop-item .price{
  flex-shrink:0;padding:8px 12px;border-radius:999px;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-size:13px;min-width:80px;text-align:center;
}
.shop-item .price:disabled{opacity:.4}

.platform-mask{
  position:fixed;inset:0;z-index:30;background:rgba(15,23,42,.7);
  display:grid;place-items:center;font-size:18px;color:#fff;font-weight:700;
}
.boot{
  position:fixed;inset:0;z-index:40;
  background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
  display:grid;place-items:center;gap:14px;
}
.boot .boot-title{
  font-weight:900;font-size:32px;letter-spacing:1px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.boot .boot-spinner{
  width:30px;height:30px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#fireworkLayer{position:fixed;inset:0;pointer-events:none;z-index:200}
.fw-particle{
  position:absolute;width:10px;height:10px;border-radius:50%;
  transform:translate(-50%,-50%);
  animation:fw-fly .85s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes fw-fly{
  0%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.2);opacity:0}
}

@media (max-width:380px){
  .stat strong{font-size:12px}
  .stat small{font-size:7px}
  .ctrl-btn{min-height:46px;font-size:22px}
  .drop-btn,.rotate-btn{min-height:42px;font-size:18px}
  .ad-btn{min-height:42px}
  .canvas-wrap{padding-right:44px}
  .friend{width:40px;height:50px}
  .mini-opp canvas{width:52px;height:78px}
}
</style>
</head>
<body>

<div class="app" id="app" hidden>
  <header class="top-bar">
    <div class="stat"><strong id="level">1</strong><small id="levelLabel">Ур.</small></div>
    <div class="stat"><strong id="score">0</strong><small>Очки</small></div>
    <div class="stat"><strong id="viruses">0</strong><small>Вирусы</small></div>
    <div class="stat"><strong id="timer">0:00</strong><small>Время</small></div>
    <button id="settingsButton" class="icon-btn" aria-label="Настройки">⚙</button>
    <button id="pauseButton" class="icon-btn" aria-label="Пауза" disabled>Ⅱ</button>
  </header>

  <div class="preview-top">
    <span>Следующая</span>
    <div class="preview" id="preview"></div>
  </div>

  <main class="board-area">
    <div class="canvas-wrap">
      <div class="canvas-inner">
        <canvas id="board" width="400" height="600" aria-label="Игровое поле 8×12"></canvas>
        <div class="virus-column" aria-hidden="true">
          <div class="friend"></div>
          <div class="friend"></div>
          <div class="friend"></div>
        </div>
      </div>
    </div>

    <div class="notice" id="notice" aria-live="polite"></div>

    <div class="controls-v2" id="controls">
      <button class="ctrl-btn drop-btn" data-act="drop" aria-label="Быстрое падение">⤓</button>
      <button class="ctrl-btn ad-btn" id="adBombButton" data-act="adbomb" aria-label="Бомба за рекламу">
        <span class="ad-emoji">📺</span>
        <span class="ad-plus">+💣</span>
      </button>
      <button class="ctrl-btn rotate-btn" data-act="rotate" aria-label="Поворот">↻</button>
      <button class="ctrl-btn left-btn" data-act="left" aria-label="Влево">←</button>
      <button class="ctrl-btn bomb-btn zero" id="bombButton" data-act="bomb" aria-label="Бомба">
        <span class="bomb-emoji">💣</span>
        <span class="bomb-count" id="bombCount">0</span>
      </button>
      <div class="mini-opp" id="miniOpp" aria-hidden="true">
        <canvas id="duelOppBoard" width="60" height="90"></canvas>
      </div>
      <button class="ctrl-btn right-btn" data-act="right" aria-label="Вправо">→</button>
    </div>

    <div class="footer" id="cloudStatus" aria-live="polite"></div>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <section class="dialog" id="dialog" role="dialog" aria-modal="true" tabindex="-1"></section>
</div>

<div class="platform-mask" id="platform-mask" hidden>…</div>

<div class="boot" id="boot">
  <div class="boot-title">ANTIVIRUS</div>
  <div class="boot-spinner"></div>
</div>

<div id="fireworkLayer" aria-hidden="true"></div>

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<script>
'use strict';

const VK_APP_ID = 54764920;
const W = 8, H = 12, N = 30;
const KEY = 'antivirus-vk-1';
const COLORS = ['#f43f5e', '#f59e0b', '#3b82f6'];
const DIR = [[1,0],[0,1],[-1,0],[0,-1]];
const BOMB_THRESHOLD = 10;
const RESCUE_ROWS = 5;
const INTERSTITIAL_EVERY = 2;
const FALL_SLOWDOWN = 1.75;
const MIN_FALL_INTERVAL = 0.6;

const DUEL_TARGET = 15;
const DUEL_MAX_GARBAGE = 5;
const DUEL_BOT_DELAY = 120 * 1000;

// [PLATFORM-FIX] Rewarded-реклама (VKWebAppShowNativeAds с форматом
// reward) работает только в нативных мобильных приложениях VK.
// На mobile_web и desktop_web не поддерживается — там кнопки
// rewarded-рекламы нужно скрывать.
// vk_platform пустой (dev-режим, запуск вне VK) → кнопки оставляем,
// чтобы не спрятать их у реального Android/iOS-пользователя.
let __vkPlatform = '';
try {
  __vkPlatform = new URLSearchParams(location.search).get('vk_platform') || '';
} catch(e){ __vkPlatform = ''; }
const __isWebPlatform = /web$/.test(__vkPlatform);
const __rewardedAdsAvailable = !__isWebPlatform;
if(!__rewardedAdsAvailable){
  document.body.classList.add('no-rewarded-ads');
}

// === Менеджер рекламы ===
// [AD-FIX] Ограничивает частоту и суточное количество рекламных показов.
const AD_INTERSTITIAL_COOLDOWN = 60 * 1000;
const AD_REWARDED_COOLDOWN     = 30 * 1000;
const AD_DAILY_LIMIT           = 15;
const AD_CHECK_TIMEOUT         = 1500;
const AD_SHOW_TIMEOUT          = 8000;

let lastInterstitialAt = 0;
let lastRewardedAt     = 0;
let adDailyCount       = 0;
let adDailyResetAt     = Date.now() + 24*60*60*1000;
let adRequestPending   = false;

// [AD-FIX] Единая проверка лимитов перед любым рекламным запросом.
function adCanShow(kind){
  const now = Date.now();
  if(now >= adDailyResetAt){ adDailyCount = 0; adDailyResetAt = now + 24*60*60*1000; }
  if(adDailyCount >= AD_DAILY_LIMIT){
    console.warn('[Ads] daily limit reached');
    return {ok:false, reason:'daily_limit'};
  }
  if(kind === 'interstitial' && now - lastInterstitialAt < AD_INTERSTITIAL_COOLDOWN){
    console.warn('[Ads] cooldown ' + Math.ceil((AD_INTERSTITIAL_COOLDOWN - (now-lastInterstitialAt))/1000) + 's left');
    return {ok:false, reason:'cooldown'};
  }
  if(kind === 'rewarded' && now - lastRewardedAt < AD_REWARDED_COOLDOWN){
    console.warn('[Ads] cooldown ' + Math.ceil((AD_REWARDED_COOLDOWN - (now-lastRewardedAt))/1000) + 's left');
    return {ok:false, reason:'cooldown'};
  }
  if(adRequestPending) return {ok:false, reason:'pending'};
  return {ok:true};
}

// [AD-FIX] Проверяет доступность формата с ограниченным ожиданием Bridge.
async function adCheckAvailable(kind){
  if(!vkReady) return false;
  try{
    const fmt = kind === 'rewarded' ? 'reward' : 'interstitial';
    const r = await Promise.race([
      vkBridge.send('VKWebAppCheckNativeAds', {ad_format: fmt}),
      new Promise((_,rj)=>setTimeout(()=>rj(new Error('check timeout')), AD_CHECK_TIMEOUT))
    ]);
    return !!r?.result;
  }catch(e){
    if(e?.message === 'check timeout') console.warn('[Ads] check timeout');
    console.warn('[Ads] check failed:', e?.message||e);
    return false;
  }
}

// [AD-FIX] Сериализует показы и обновляет лимиты только после успешного показа.
async function adShow(kind){
  if(!vkReady) return false;
  const gate = adCanShow(kind);
  if(!gate.ok){
    console.warn('[Ads] blocked:', gate.reason);
    return false;
  }
  adRequestPending = true;
  try{
    const fmt = kind === 'rewarded' ? 'reward' : 'interstitial';

  unlocked:1, stars:Array(N).fill(0), best:{kills:0,time:0,score:0},

const num = (v,min=0,max=1e9)=>Math.max(min,Math.min(max,Number.isFinite(Number(v))?Number(v):min));
function normalize(raw){
  const s=fresh(); if(!raw||typeof raw!=='object')return s;
  s.unlocked=Math.floor(num(raw.unlocked,1,N));
  s.stars=s.stars.map((_,i)=>Math.floor(num(raw.stars?.[i],0,3)));
  for(let i=0;i<N;i++)if(s.stars[i])s.unlocked=Math.max(s.unlocked,Math.min(N,i+2));
  for(const k of ['kills','time','score'])s.best[k]=num(raw.best?.[k]);
  s.best.kills=Math.floor(s.best.kills);
  const o=raw.settings||{};
  for(const k of ['sound','music','voice'])s.settings[k]=o[k]!==false;
  s.settings.allowShare = o.allowShare === true;
  s.settings.sensitivity=num(o.sensitivity??30,15,65);
  s.settings.lang=['auto','ru','en'].includes(o.lang)?o.lang:'auto';
  s.settings.theme=Math.floor(num(o.theme,0,3));
  const p=raw.purchases||{};
  s.purchases.remove_ads=!!p.remove_ads;
  s.purchases.unlock_all=!!p.unlock_all;
  return s;
}

    const r=await Promise.race([
      vkBridge.send('VKWebAppStorageGet',{keys:['progress']}),

    ]);

let cloudTimer=null, cloudDirty=false, cloudSaving=false;
let cloudRetryCount = 0;
const CLOUD_SAVE_TIMEOUT = 3000;
const CLOUD_SAVE_MAX_RETRY = 3;
// [VK-FIX] Сохраняет прогресс с timeout и ограниченным числом повторов.
async function vkCloudSave(){
  if(!vkReady||cloudSaving)return;
  cloudSaving=true; cloudDirty=false;
  let ok = false;
  try{
    const r = await Promise.race([
      vkBridge.send('VKWebAppStorageSet',{key:'progress',value:JSON.stringify({unlocked:save.unlocked,stars:save.stars,best:save.best,purchases:save.purchases})}),
      new Promise((_,rj)=>setTimeout(()=>rj(new Error('save timeout')), CLOUD_SAVE_TIMEOUT))
    ]);
    if(r && r.result !== false){
      ok = true;
      cloudRetryCount = 0;
      console.warn('[Cloud] save ok');
      setCloudStatus(t('cloudSave'));
      // Через 2 секунды вернуть нейтральный статус.
      clearTimeout(window._cloudStatusTimer);
      window._cloudStatusTimer = setTimeout(()=>{
        setCloudStatus(vkReady ? t('cloudCloud') : t('cloudSDK'));
      }, 2000);
    }
  }catch(e){
    if(e?.message === 'save timeout') console.warn('[VK] StorageSet timeout');
    console.warn('[Cloud] save failed:', e?.message||e);
  }finally{
    cloudSaving=false;
    if(!ok){
      cloudDirty = true;
      if(cloudRetryCount < CLOUD_SAVE_MAX_RETRY){
        cloudRetryCount++;
        console.warn('[Cloud] save retry ' + cloudRetryCount + '/' + CLOUD_SAVE_MAX_RETRY);
        scheduleSave();
      }else{
        console.warn('[Cloud] give up after ' + CLOUD_SAVE_MAX_RETRY + ' retries');
        setCloudStatus(t('cloudError'));
        cloudRetryCount = 0;
      }
    }
  }
}

function duelConnect(){
  return new Promise((resolve, reject) => {
    if(duelState.socket && duelState.socket.readyState === 1) return resolve();
    const params = new URLSearchParams(location.search);
    const url = WS_URL + '?' + params.toString();
    const ws = new WebSocket(url);
    ws.onopen = () => { duelState.socket = ws; resolve(); };
    ws.onerror = e => reject(e);
    ws.onclose = () => {
      if(duelState.started) showToast(t('duelConnLost'));
    };
    ws.onmessage = ev => {
      try { handleDuelMessage(JSON.parse(ev.data)); }
      catch(e){ console.warn('[Duel] bad msg', e); }
    };
  });
}
function duelSend(msg){
  if(duelState.socket?.readyState === 1) duelState.socket.send(JSON.stringify(msg));
}

function duelDrawOppBoard(board){
  const c = $('duelOppBoard');
  if(!c) return;
  const cx = c.getContext('2d');
  const cw = c.width / W, ch = c.height / H;
  cx.clearRect(0,0,c.width,c.height);
  if(!board) return;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const cell = board[y]?.[x];
    if(!cell) continue;
    cx.fillStyle = cell.type === 'virus' ? COLORS[cell.color] : '#cbd5e1';
    cx.fillRect(x*cw, y*ch, cw-0.3, ch-0.3);
  }
}

function initBotBoard(){
  const board = Array.from({length:H}, () => Array(W).fill(null));
  const positions = [];
  for(let y = 4; y < H; y++) for(let x = 0; x < W; x++) positions.push([x,y]);
  for(let i = positions.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [positions[i], positions[j]] = [positions[j], positions[i]];
  }
  const target = DUEL_TARGET;
  for(let i = 0; i < target && i < positions.length; i++){
    const [x,y] = positions[i];
    board[y][x] = { type: 'virus', color: Math.floor(Math.random()*3) };
  }
  duelState.botBoard = board;
  duelDrawOppBoard(board);
}

function updateBotBoardRemoveOne(){
  if(!duelState.botBoard) return;
  const viruses = [];
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    if(duelState.botBoard[y][x]) viruses.push([x,y]);
  }
  if(viruses.length === 0) return;
  const [x,y] = viruses[Math.floor(Math.random()*viruses.length)];
  duelState.botBoard[y][x] = null;
  duelDrawOppBoard(duelState.botBoard);
}

function handleDuelMessage(msg){
  switch(msg.type){
    case 'welcome': break;
    case 'queue_waiting':
      duelState.botTimeout = setTimeout(()=>{
        duelState.botMode = true;
        duelState.opponent = { playerId: 'BOT' };
        showToast(t('duelBotFallback'));
        duelStart('bot');
      }, DUEL_BOT_DELAY);
      break;
    case 'queue_cancelled':
      clearTimeout(duelState.botTimeout);
      duelState.botTimeout = null;
      showToast('Отменено');
      break;
    case 'match_found':
      clearTimeout(duelState.botTimeout);
      duelState.roomId = msg.roomId;
      duelState.role = msg.role;
      duelState.opponent = msg.opponent;
      duelStart('online');
      break;
    case 'room_created':
      duelState.roomId = msg.roomId;
      duelShowWaiting();
      break;
    case 'opponent_joined':
      duelState.opponent = msg.opponent;
      duelStart('online');
      break;
    case 'opponent_state':
      duelState.oppViruses = msg.state.viruses || 0;
      duelUpdateProgress();
      if(msg.state.board) duelDrawOppBoard(msg.state.board);
      break;
    case 'garbage_incoming':
      duelEnqueueGarbage(msg.cells);
      break;
    case 'opponent_game_over':
      if(msg.reason === 'target_reached'){
        duelEnd(false, t('duelOppReachedTarget'));
      } else if(msg.reason === 'overflow'){
        duelEnd(true, t('duelOppOverflow'));
      } else {
        duelEnd(true, t('duelOppLeft'));
      }
      break;
    case 'opponent_left':
      duelEnd(true, t('duelOppLeft'));
      break;
    case 'matchmaking_timeout':
      if(!duelState.botMode && !duelState.started){
        duelState.botMode = true;
        duelState.opponent = { playerId: 'BOT' };
        duelStart('bot');
      }
      break;
  }
}

function duelStartBot(){
  duelStopBot();
  initBotBoard();
  duelState.botMoveCount = 0;
  duelState.botGarbageFired = false;

  const scheduleBotMove = () => {
    duelState.botInterval = setTimeout(() => {
      if(!duelState.started || !duelState.botMode) return;
      duelState.botMoveCount++;

      const removeCount = Math.random() < 0.25 ? 2 : 1;
      for(let i = 0; i < removeCount && duelState.oppViruses < DUEL_TARGET; i++){
        duelState.oppViruses++;
        updateBotBoardRemoveOne();
      }
      duelUpdateProgress();

      if(duelState.oppViruses >= DUEL_TARGET){
        duelEnd(false, t('duelBotWin'));
        return;
      }

      if(!duelState.botGarbageFired && Math.random() < 0.05){
        duelState.botGarbageFired = true;
        const cells = 2 + Math.floor(Math.random()*2);
        duelEnqueueGarbage(cells);
      }

      scheduleBotMove();
    }, 6000 + Math.random() * 7000);
  };

  scheduleBotMove();
}

  duelState.botInterval = null;

function duelEnqueueGarbage(cells){
  cells = Math.max(1, Math.min(cells, DUEL_MAX_GARBAGE));
  playGarbageSound();
  showToast(t('duelGarbage') + cells);
  if(active===null && state==='fall') spawnGarbageCells(cells);
  else duelState.garbageQueue += cells;
}
function playGarbageSound(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!audio){
      audio = new AC();
      musicBus = audio.createGain(); effectsBus = audio.createGain();
      musicBus.gain.value = 0; effectsBus.gain.value = 0;
      musicBus.connect(audio.destination); effectsBus.connect(audio.destination);
    }
    if(audio.state === 'suspended') audio.resume();
    const now = audio.currentTime;
    const seq = [
      { f: 660, t: 0.00, d: 0.08 },
      { f: 880, t: 0.10, d: 0.08 },
      { f: 440, t: 0.22, d: 0.14 }
    ];
    seq.forEach(({f,t,d})=>{
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + t);
      g.gain.exponentialRampToValueAtTime(0.25, now + t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t + d);
      o.connect(g); g.connect(effectsBus);
      o.start(now + t); o.stop(now + t + d + 0.02);
    });
  }catch(e){}
}
function pickGarbageColumns(count){
  const result = new Set();
  for(let i=0;i<count;i++){
    let col, tries = 0;
    do {
      col = Math.floor(Math.random() * W);
      tries++;
    } while((result.has(col) || lastGarbageColumns.includes(col)) && tries < 40);
    result.add(col);
    lastGarbageColumns.push(col);
    if(lastGarbageColumns.length > 3) lastGarbageColumns.shift();
  }
  return [...result];
}
function spawnGarbageCells(count){
  const cols = pickGarbageColumns(count);
  for(const col of cols){
    garbagePieces.push({
      x: col,
      y: -1,
      color: Math.floor(Math.random() * 3),
      fallAcc: 0
    });
  }
}
function updateGarbage(dt){
  for(let i = garbagePieces.length - 1; i >= 0; i--){
    const g = garbagePieces[i];
    g.fallAcc += dt;
    const stepTime = 0.85;
    while(g.fallAcc >= stepTime){
      g.fallAcc -= stepTime;
      const nextY = g.y + 1;
      if(nextY >= H || (g.y >= 0 && grid[nextY] && grid[nextY][g.x])){
        if(g.y >= 0) grid[g.y][g.x] = { type: 'virus', color: g.color };
        garbagePieces.splice(i, 1);
        break;
      } else {
        g.y = nextY;
        if(g.y >= 0 && grid[g.y] && grid[g.y][g.x]){
          if(g.y - 1 >= 0) grid[g.y - 1][g.x] = { type: 'virus', color: g.color };
          garbagePieces.splice(i, 1);
          break;
        }
      }
    }
  }
  if(garbagePieces.length === 0 && state === 'waiting_garbage'){
    spawn();
  }
}

function start(m,n){
  if(platformPaused||document.hidden)return;
  if(m==='campaign'&&(!Number.isInteger(n)||n<1||n>N))return;
  if(m==='campaign'&&n>save.unlocked&&!save.purchases.unlock_all && !duelMode)return;
  mode=m;level=n;wave=1;
  grid=Array.from({length:H},()=>Array(W).fill(null));
  active=null;next=pair();serial=1;
  score=kills=elapsed=moves=fall=phase=combo=0;
  matches=[];particles=[];garbagePieces=[];
  moveCleared=0;bombAwarded=false;bombsAvailable=1;
  updateBombButton();
  running=true;paused=false;state='fall';last=performance.now();
  document.querySelectorAll('.friend').forEach(e=>e.classList.remove('hurt'));
  const d=difficulty(n);
  if(duelMode){
    addViruses(DUEL_TARGET, 4);
  } else if(m==='training'){
    addViruses(5, 6);
    ensureTrainingColors();
  } else if(m==='campaign'){
    addViruses(d.viruses, d.top);
  } else {
    addViruses(14, 6);
  }
  clearInput();hide();spawn();updateHUD();tell('noticeStart');
  if(m==='training') showTrainingStep(1);
  // [TIMER-FIX] Сбрасывает ввод и базовое время при старте новой игры.
  pointer = null;
  buttonHold = null;
  pressed.clear();
  last = performance.now();
}
function cells(p=active){
  if(!p)return[];
  const [dx,dy]=DIR[p.rotation];
  return[{x:p.x,y:p.y,color:p.colors[0]},{x:p.x+dx,y:p.y+dy,color:p.colors[1]}];
}
function valid(p){return !!p&&cells(p).every(c=>c.x>=0&&c.x<W&&c.y>=0&&c.y<H&&!grid[c.y][c.x]);}
function spawn(){
  if(duelState.garbageQueue > 0){
    spawnGarbageCells(duelState.garbageQueue);
    duelState.garbageQueue = 0;
  }
  if(duelMode && garbagePieces.length > 0){
    active = null;
    state = 'waiting_garbage';
    return;
  }
  active={x:3,y:0,rotation:0,colors:next,id:serial++,bomb:false};
  next=pair();
  fall=0;combo=0;state='fall';
  if(!valid(active)){active=null;finish(false);}
}
function move(dx,dy){if(!active)return false;const p={...active,x:active.x+dx,y:active.y+dy};if(!valid(p))return false;active=p;return true;}
function rotate(){if(!active)return;for(const [dx,dy]of[[0,0],[-1,0],[1,0],[0,-1],[0,1]]){const p={...active,x:active.x+dx,y:active.y+dy,rotation:(active.rotation+1)%4};if(valid(p)){active=p;sound('turn');return;}}}
function bombArea(p){return{x:Math.max(0,Math.min(W-3,p.x-1)),y:Math.max(0,Math.min(H-3,p.y-1))};}
function lock(){
  if(!active)return;
  const p=active;active=null;moves++;phase=0;combo=0;
  moveCleared=0;bombAwarded=false;
  if(p.bomb){
    const a=bombArea(p);matches=[];
    for(let y=a.y;y<a.y+3;y++)for(let x=a.x;x<a.x+3;x++)if(grid[y][x])matches.push(y*W+x);
    combo=1;erase(true);state='gravity';explosionSound();tell('noticeClear');

    for(const c of cells(p))grid[c.y][c.x]={type:'pill',color:c.color,link:p.id};

}
function action(a){
  if(!playable())return;
  if(a==='bomb'){useBomb();return;}
  if(a==='adbomb'){requestBombViaAd();return;}
  if(state!=='fall'||!active)return;
  if(a==='left'){if(move(-1,0))sound('move');}
  if(a==='right'){if(move(1,0))sound('move');}
  if(a==='rotate')rotate();
  if(a==='soft'){if(!move(0,1))lock();fall=0;}
  if(a==='drop'){while(move(0,1)){}lock();}
  updateHUD();

function useBomb(){

function gravity(){
  const links=new Map();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(c?.type!=='pill')continue;if(!links.has(c.link))links.set(c.link,[]);links.get(c.link).push({x,y,c});}
  const groups=[...links.values()].sort((a,b)=>Math.max(...b.map(c=>c.y))-Math.max(...a.map(c=>c.y)));
  let moved=false;
  for(const g of groups){
    const own=new Set(g.map(c=>c.y*W+c.x));
    if(!g.every(c=>c.y+1<H&&(!grid[c.y+1][c.x]||own.has((c.y+1)*W+c.x))))continue;
    for(const c of g)grid[c.y][c.x]=null;
    for(const c of g)grid[c.y+1][c.x]=c.c;
    moved=true;
  }
  return moved;
}
function erase(bomb=false){

    grid[y][x]=null;
  }

  } else {

    setTimeout(()=>{

        paused = true;
        show(`<h2>\u{1F393} ${t('trainingTitle')}</h2>
          <p>${t('trainingBomb')}</p>
          <div class="stack">
            <button data-menu="training-next" class="primary">${t('trainingContinue')}</button>
          </div>`, 'training');
      }
    }, 600);
  }
  if(duelMode) duelMyVirusesChanged(kills);
  record();
}
function resolution(dt){
  if(state === 'waiting_garbage') return;
  phase+=dt;
  if(state==='scan'){
    matches=findMatches();phase=0;
    if(matches.length){combo++;state='flash';}
    else if(!count()){
      if(mode==='campaign'&&!duelMode)finish(true);
      else if(mode==='training'&&!duelMode)trainingComplete();
      else{wave++;if(!addViruses(Math.min(36,12+wave*2),4)){if(!duelMode)finish(false);}else{tell('noticeWave',wave);spawn();}}
    }
    else spawn();
  }else if(state==='flash'&&phase>=.28){erase();state='gravity';phase=0;}
  else if(state==='gravity'&&phase>=.075){phase=0;if(!gravity())state='scan';}
}

function findMatches(){
  const found=new Set();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=grid[y][x];if(!c)continue;
    for(const [dx,dy]of[[1,0],[0,1]]){
      if(grid[y-dy]?.[x-dx]?.color===c.color)continue;
      const line=[];let xx=x,yy=y;
      while(xx<W&&yy<H&&grid[yy][xx]?.color===c.color){line.push(yy*W+xx);xx+=dx;yy+=dy;}
      if(line.length>=4)line.forEach(i=>found.add(i));
    }
  }
  return [...found];
}
function addViruses(n,top){
  const spaces=[];
  for(let y=top;y<H;y++)for(let x=0;x<W;x++)if(!grid[y][x])spaces.push([x,y]);
  for(let i=spaces.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[spaces[i],spaces[j]]=[spaces[j],spaces[i]];}
  let added=0;
  for(const [x,y]of spaces){
    if(added>=n)break;
    const color=Math.floor(Math.random()*3);
    for(let k=0;k<3;k++){
      grid[y][x]={type:'virus',color:(color+k)%3};
      if(!findMatches().length){added++;break;}
      grid[y][x]=null;
    }
  }
  return added;
}
// [TRAINING-FIX] Гарантирует 3 разных цвета вирусов в обучении.
function ensureTrainingColors(){
  const cells = [];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(grid[y][x]?.type === 'virus') cells.push({x,y});
  }
  if(cells.length < 3) return;
  const distinctCount = () => new Set(cells.map(c => grid[c.y][c.x].color)).size;
  if(distinctCount() >= 3) return;
  let guard = 60;
  while(distinctCount() < 3 && guard-- > 0){
    const shuffled = cells.slice().sort(() => Math.random() - 0.5);
    for(const c of shuffled){
      if(distinctCount() >= 3) break;
      const cur = grid[c.y][c.x].color;
      const candidates = [0,1,2].filter(x => x !== cur).sort(() => Math.random() - 0.5);
      for(const nc of candidates){
        grid[c.y][c.x].color = nc;
        if(!findMatches().length) break;
        grid[c.y][c.x].color = cur;
      }
    }
  }
}

function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function drawCell(x,y,c,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;
  const px=x*50+25,py=y*50+25,color=COLORS[c.color];
  ctx.translate(px,py);
  if(c.type==='virus'){
    ctx.rotate(Math.sin(clock*2+x+y)*.07);
    ctx.strokeStyle=color;ctx.lineWidth=3.5;ctx.fillStyle=color;
    for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(a)*13,Math.sin(a)*13);ctx.lineTo(Math.cos(a)*20,Math.sin(a)*20);ctx.stroke();circle(Math.cos(a)*20,Math.sin(a)*20,2);ctx.fill();}
    circle(0,0,15);ctx.fill();
    ctx.fillStyle='white';circle(-5,-3,4.5);ctx.fill();circle(5,-3,4.5);ctx.fill();
    ctx.fillStyle='#0f172a';circle(-4,-2,2);ctx.fill();circle(6,-2,2);ctx.fill();
    ctx.strokeStyle='#0f172a';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.arc(0,4,5,0,Math.PI);ctx.stroke();
  }else{
    const g=ctx.createLinearGradient(-14,-18,14,18);
    g.addColorStop(0,'#ffffff');g.addColorStop(.3,color);g.addColorStop(1,color+'cc');
    ctx.fillStyle=g;circle(0,0,19);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.5;ctx.stroke();
  }
  ctx.restore();
}
function connection(a,b,alpha=1,bomb=false){
  ctx.save();ctx.globalAlpha=alpha;
  const ax=a.x*50+25,ay=a.y*50+25,bx=b.x*50+25,by=b.y*50+25;
  const g=ctx.createLinearGradient(ax,ay,bx,by);
  g.addColorStop(0,bomb?'#c4b5fd':COLORS[a.color]);
  g.addColorStop(1,bomb?'#8b5cf6':COLORS[b.color]);
  ctx.strokeStyle=g;ctx.lineWidth=bomb?34:26;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
  if(bomb){ctx.fillStyle='white';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💣',(ax+bx)/2,(ay+by)/2);}
  ctx.restore();
}
function drawPiece(p,alpha){
  const c=cells(p);if(!c.length)return;
  connection(c[0],c[1],alpha,p.bomb);
  if(!p.bomb)c.forEach(v=>drawCell(v.x,v.y,{type:'pill',color:v.color},alpha));
}
function draw(){
  const g=ctx.createLinearGradient(0,0,400,600);
  g.addColorStop(0,'#ffffff');g.addColorStop(1,'#f1f5f9');
  ctx.fillStyle=g;ctx.fillRect(0,0,400,600);
  ctx.strokeStyle='rgba(100,116,139,.15)';ctx.lineWidth=1;
  for(let x=1;x<W;x++){ctx.beginPath();ctx.moveTo(x*50,0);ctx.lineTo(x*50,600);ctx.stroke();}
  for(let y=1;y<H;y++){ctx.beginPath();ctx.moveTo(0,y*50);ctx.lineTo(400,y*50);ctx.stroke();}
  const links=new Map();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(c?.type==='pill'){if(!links.has(c.link))links.set(c.link,[]);links.get(c.link).push({x,y,color:c.color});}}
  for(const group of links.values())if(group.length===2)connection(group[0],group[1]);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x])drawCell(x,y,grid[y][x]);

  for(const gm of garbagePieces){
    if(gm.y>=0) drawCell(gm.x,gm.y,{type:'virus',color:gm.color});
    else {
      ctx.save();
      ctx.globalAlpha=0.6;
      ctx.fillStyle=COLORS[gm.color];
      ctx.beginPath();
      ctx.arc(gm.x*50+25, 5, 8, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  if(active){
    const ghost={...active};while(valid({...ghost,y:ghost.y+1}))ghost.y++;
    if(active.bomb){const a=bombArea(ghost);ctx.save();ctx.fillStyle='rgba(139,92,246,.15)';ctx.strokeStyle='#8b5cf6';ctx.setLineDash([6,4]);ctx.fillRect(a.x*50,a.y*50,150,150);ctx.strokeRect(a.x*50+2,a.y*50+2,146,146);ctx.restore();}
    drawPiece(ghost,.2);drawPiece(active,1);
  }
  if(state==='flash'){ctx.fillStyle=`rgba(255,255,255,${.4+.4*Math.sin(phase*35)**2})`;for(const i of matches)ctx.fillRect(i%W*50+2,Math.floor(i/W)*50+2,46,46);}
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.55);ctx.fillStyle=p.color;circle(p.x,p.y,3);ctx.fill();}
  ctx.globalAlpha=1;
}

let audio=null,musicBus=null,effectsBus=null,noteAt=0,musicStep=0;

function initAudio(){
  if(platformPaused||document.hidden)return;
  try{
    if(!audio){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      audio=new C();
      musicBus=audio.createGain();effectsBus=audio.createGain();
      musicBus.gain.value=0;effectsBus.gain.value=0;
      musicBus.connect(audio.destination);effectsBus.connect(audio.destination);
    }
    if(audio.state==='suspended')audio.resume().catch(()=>{});
    syncAudio();
  }catch{}
}
function syncAudio(){
  if(!audio)return;
  const now=audio.currentTime;
  const blocked=paused||platformPaused||document.hidden;
  const mt=(!blocked&&running&&save.settings.music)?.16:0;
  const st=(!blocked&&save.settings.sound)?.3:0;
  musicBus.gain.cancelScheduledValues(now);musicBus.gain.setValueAtTime(mt,now);
  effectsBus.gain.cancelScheduledValues(now);effectsBus.gain.setValueAtTime(st,now);
}
function tone(f,d,t0,bus,type='sine',vol=.15){
  if(!audio||!bus)return;
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+.015);
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(bus);
  o.start(t0);o.stop(t0+d+.03);
  o.onended=()=>{o.disconnect();g.disconnect();};
}
function sound(kind){
  if(!audio||paused||platformPaused||document.hidden||!save.settings.sound)return;
  const notes={move:[310],turn:[470,630],drop:[240],clear:[523,659,784],praise:[523,659,784,1047],win:[523,659,784,1047],lose:[330,277,220]}[kind]||[440];
  notes.forEach((f,i)=>tone(f,.16,audio.currentTime+i*.075,effectsBus));
}
function bombSpawnSound(){
  if(!audio||!save.settings.sound)return;
  const now=audio.currentTime;
  const o=audio.createOscillator(),g=audio.createGain();
  o.type='sine';o.frequency.setValueAtTime(180,now);o.frequency.exponentialRampToValueAtTime(860,now+.32);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.22,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.4);
  o.connect(g);g.connect(effectsBus);o.start(now);o.stop(now+.42);
}
function explosionSound(){
  if(!audio||!save.settings.sound)return;
  const now=audio.currentTime,dur=.55;
  const buffer=audio.createBuffer(1,Math.floor(audio.sampleRate*dur),audio.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++){const env=Math.pow(1-i/data.length,2.6);data[i]=(Math.random()*2-1)*env;}
  const src=audio.createBufferSource();src.buffer=buffer;
  const filt=audio.createBiquadFilter();filt.type='lowpass';
  filt.frequency.setValueAtTime(1400,now);filt.frequency.exponentialRampToValueAtTime(140,now+dur);
  const ng=audio.createGain();ng.gain.value=.5;
  src.connect(filt);filt.connect(ng);ng.connect(effectsBus);
  src.start(now);src.stop(now+dur);
}
function praise(){
  sound('praise');

  const voice=speechSynthesis.getVoices().find(v=>v.localService&&normalizeLang(v.lang)===currentLang);
  if(!voice)return;
  stopSpeech();

}
// [TIMER-FIX] Не допускает повторного музыкального интервала.
let _musicTimer = null;
if(_musicTimer) clearInterval(_musicTimer);
_musicTimer = setInterval(()=>{
  if(!audio||audio.state!=='running'||!playable()||!save.settings.music){noteAt=0;return;}
  const theme=themes[save.settings.theme??0];
  const now=audio.currentTime;
  if(noteAt<now)noteAt=now+.04;
  while(noteAt<now+.18){
    const chord=theme.chords[Math.floor(musicStep/8)%4];
    tone(chord[[0,1,2,1,0,2,1,2][musicStep%8]%chord.length]*2,theme.step*1.7,noteAt,musicBus,theme.type,.12);
    if(musicStep%8===0)chord.forEach(f=>tone(f,theme.step*7.5,noteAt,musicBus,'sine',.045));
    noteAt+=theme.step;musicStep++;
  }
},90);

function frame(now){
  const dt=Math.min((now-last)/1000,.1);
  last=now;
  if(playable()){
    elapsed+=dt;clock+=dt;
    if(noticeLeft>0){noticeLeft-=dt;if(noticeLeft<=0)$('notice').textContent='';}
    if(buttonHold&&now>=buttonHold.at){action(buttonHold.act);if(buttonHold)buttonHold.at=now+75;}
    if(duelMode){
      if(garbagePieces.length > 0) updateGarbage(dt);
      if(garbagePieces.length === 0 && state === 'waiting_garbage') spawn();
    }
    if(state==='fall'&&active){
      const rawInterval = mode==='campaign'
        ? Math.max(.22, difficulty(level).interval - Math.min(.1, elapsed*.0003))
        : Math.max(.15, .92 - wave*.043 - elapsed*.00065);
      const interval = Math.max(MIN_FALL_INTERVAL, rawInterval * FALL_SLOWDOWN);
      fall+=dt;
      const soft=pressed.has('ArrowDown')||pressed.has('KeyS')||buttonHold?.act==='soft';
      if(fall>=(soft?.055:interval)){fall=0;if(!move(0,1))lock();}
    }else resolution(dt);
    for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;}
    particles=particles.filter(p=>p.life>0);
  }
  hudTick+=dt;if(hudTick>.1){hudTick=0;updateHUD();updateAdButton();}
  draw();
  requestAnimationFrame(frame);
}

const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'rotate',KeyW:'rotate',Space:'drop'};
document.addEventListener('keydown',e=>{
  if(platformPaused)return;
  if(!$('overlay').hidden){if(e.code==='Escape'&&screen==='pause'){e.preventDefault();resume();}return;}
  if(['Escape','KeyP'].includes(e.code)){e.preventDefault();if(!e.repeat)pause();return;}
  if(!playable())return;
  if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();pressed.add(e.code);return;}
  const a=keyMap[e.code];if(!a)return;e.preventDefault();
  if(!e.repeat||a==='left'||a==='right')action(a);
});
document.addEventListener('keyup',e=>pressed.delete(e.code));

document.querySelectorAll('[data-act]').forEach(b=>{

    if(b.disabled)return;
    if(!playable())return;e.preventDefault();
    try{b.setPointerCapture(e.pointerId);}catch{}
    const act=b.dataset.act;action(act);
    if(['left','right','soft'].includes(act))buttonHold={act,at:performance.now()+250};
  });
  for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>{buttonHold=null;});
});

const canvas=$('board');
canvas.addEventListener('pointerdown',e=>{
  if(!playable()||state!=='fall'||!active||pointer)return;
  e.preventDefault();
  try{canvas.setPointerCapture(e.pointerId);}catch{}
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*400,y=(e.clientY-r.top)/r.height*600;
  pointer={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,at:performance.now(),piece:active.id,onPill:cells().some(c=>Math.abs(x-c.x*50-25)<34&&Math.abs(y-c.y*50-25)<34)};
});
canvas.addEventListener('pointermove',e=>{
  if(!pointer||pointer.id!==e.pointerId||!playable())return;
  const p=pointer,dx=e.clientX-p.x,dy=e.clientY-p.y,thr=save.settings.sensitivity;
  if(Math.max(Math.abs(dx),Math.abs(dy))<thr)return;
  p.moved=true;clearTimeout(tapTimer);lastTap=0;
  const a=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'soft':'rotate');
  const n=a==='rotate'?1:Math.min(12,Math.floor(Math.max(Math.abs(dx),Math.abs(dy))/thr));
  for(let i=0;i<n;i++){if(active?.id!==p.piece)break;action(a);}
  p.x=e.clientX;p.y=e.clientY;
});
canvas.addEventListener('pointerup',e=>{
  if(!pointer||pointer.id!==e.pointerId)return;
  const p=pointer;pointer=null;const now=performance.now();
  if(!playable()||p.moved||now-p.at>450||active?.id!==p.piece)return;
  if(lastTap&&now-lastTap<280){clearTimeout(tapTimer);lastTap=0;action('drop');}
  else{lastTap=now;tapTimer=setTimeout(()=>{if(p.onPill&&active?.id===p.piece)action('rotate');lastTap=0;},280);}
});

  if(dl){

      duelStart('bot');
    }
    else if(action==='invite') duelInvite();
    else if(action==='share-confirm'){
      const link = duelState.pendingShareLink;
      if(link && vkReady && window.vkBridge){
        try{
          vkBridge.send('VKWebAppShare', {link}).catch(()=>{
            navigator.clipboard.writeText(link).then(()=>showToast(t('mpCopied'))).catch(()=>{});
          });
        }catch{
          navigator.clipboard.writeText(link).then(()=>showToast(t('mpCopied'))).catch(()=>{});
        }
      }
      duelState.pendingShareLink = null;
      duelShowWaiting();
    }
    else if(action==='share-cancel'){
      duelState.pendingShareLink = null;
      duelShowWaiting();
    }
    else if(action==='copy') {
      navigator.clipboard.writeText(`https://vk.com/app${VK_APP_ID}#duel=${duelState.roomId}`).then(()=>showToast(t('mpCopied')));
    }
    else if(action==='cancel') { duelLeave(); duelMenu(); }
    else if(action==='menu') { duelLeave(); menu(); }
    else if(action==='again') { duelLeave(); duelMenu(); }
    else if(action==='exit') { duelLeave(); menu(); }
    return;
  }

  if(!b||b.disabled||platformPaused)return;
  const a=b.dataset.menu;
  if(a.startsWith('level:')){start('campaign',Number(a.slice(6)));return;}
  if(a==='duel-cancel'){duelLeave();duelMenu();return;}

  switch(a){
    case'menu':record();menu();break;
    case'levels':levelsMenu();break;
    case 'training':
      trainingStage = 1;
      trainingBombTipShown = false;
      start('training', 0);
      break;
    case 'training-next':
      if(trainingStage === 1){ showTrainingStep(2); }
      else if(trainingStage === 2){ showTrainingStep(3); }
      else {
        trainingStage = 0;
        paused = false;
        hide();
        last = performance.now();
      }
      break;
    case 'training-done-campaign': levelsMenu(); break;
    case 'training-done-restart':
      trainingStage = 1;
      trainingBombTipShown = false;
      start('training', 0);
      break;
    case 'training-done-menu': menu(); break;
    case'endless':start('endless',1);break;
    case'settings':settingsMenu();break;
    case 'support': {
      window.open('https://vk.ru/club241751605', '_blank');
      break;
    }
    case'back':if(running)pauseMenu();else menu();break;
    case'saveSettings':
      save.settings.sound=$('set-sound').checked;
      save.settings.music=$('set-music').checked;
      save.settings.voice=$('set-voice').checked;
      save.settings.allowShare=$('set-allow-share').checked;
      save.settings.sensitivity=Number($('set-swipe').value);
      save.settings.theme=Number($('set-theme').value);

  }
});

// [BUG-FIX] Не допускает повторной инициализации приложения и RAF-цикла.
let _bootRan = false;
async function boot(){
  if(_bootRan) return;
  _bootRan = true;
  const failsafe=setTimeout(()=>{
    if($('app').hidden){
      try{applyLanguage(vkLaunchParams.vk_language||navigator.language);}catch{}
      updateHUD();updateBombButton();
      $('app').hidden=false;$('boot').hidden=true;
      if(screen==='boot')menu();
    }
  },3000);

  let ok=false;
  try{ok=await vkInit();}catch(e){console.warn('[Boot]',e);}
  if(save.settings.lang==='auto'){
    try{applyLanguage(vkLaunchParams.vk_language||navigator.language);}catch{applyLanguage('ru');}
  }else{
    applyLanguage(save.settings.lang);
  }

  updateHUD();updateBombButton();
  requestAnimationFrame(frame);

  // Загружаем облако до показа меню, с таймаутом, чтобы не залипнуть.
  if(vkReady){
    try{
      const cloud = await Promise.race([
        vkCloudLoad(),
        new Promise(r=>setTimeout(()=>r(null), 1500))
      ]);
      if(cloud){
        save = normalize({...save, ...cloud, settings: save.settings});
        writeLocal();
      }
    }catch(e){ console.warn('[Boot] cloud load failed', e); }
  }

  // Теперь показываем UI уже с актуальным прогрессом.
  menu();
  $('app').hidden=false;
  $('boot').hidden=true;
  clearTimeout(failsafe);
  setCloudStatus(vkReady ? t('cloudCloud') : t('cloudSDK'));

  if(vkReady&&window.vkBridge){
    try{
      vkBridge.subscribe(e=>{
        const type=e?.detail?.type;
        if(type==='VKWebAppViewHide')platformPause();
        if(type==='VKWebAppViewRestore')platformResume();
        if(type==='VKWebAppAudioPaused'){save.settings.sound=false;save.settings.music=false;syncAudio();}
        if(type==='VKWebAppAudioResumed'){save.settings.sound=true;save.settings.music=true;syncAudio();}
      });
    }catch{}
  }

  const hash=new URLSearchParams(location.hash.replace('#','?'));
  const inviteRoom=hash.get('duel');
  if(inviteRoom){
    duelConnect().then(()=>duelSend({type:'join_room',roomId:inviteRoom}));
  }

  if(vkReady&&window.vkBridge){
    try{await vkBridge.send('VKWebAppSetViewSettings',{status_bar_style:'dark',action_bar_color:'#ffffff'});}catch{}
  }
  console.warn('[Boot] Antivirus v2 loaded. Backups: stage7. Features: ad manager, cooldowns, timers.');
}
