<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071126">
<title>Antivirus</title>
<style>
/* ... (все ваши стили остаются без изменений) ... */
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;--cyan:#70f3ff;--muted:#a6bdd7}
*{box-sizing:border-box}
body{margin:0;color:#edf7ff;background:radial-gradient(ellipse at 20% 10%,#173665,transparent 60%),radial-gradient(ellipse at 90% 80%,#222150,transparent 60%),#071126;min-height:100dvh}
button,input,select{font:inherit}
button,select{color:#eefaff;background:#133455;border:1px solid #459cc4;border-radius:12px;padding:10px 14px}
button{cursor:pointer;touch-action:manipulation}
button:hover{background:#235477}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:3px}
.primary{background:linear-gradient(120deg,#71fff0,#63bdff);color:#062036;font-weight:800}
[hidden]{display:none!important}
.app{max-width:1020px;margin:auto;padding:10px}
header{display:grid;justify-items:center;gap:3px;margin-bottom:10px}
.brand{display:block;width:min(370px,85vw);height:145px;object-fit:contain;filter:drop-shadow(0 0 13px #55ddff88)}
.header-buttons{display:flex;gap:8px}
.header-buttons button{padding:6px 13px;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px;align-items:start}
.board-wrap{position:relative;display:grid;justify-items:center;padding-right:57px;min-width:0}
canvas{display:block;width:min(100%,510px,max(240px,calc((100dvh - 255px)*.666667)));height:auto;aspect-ratio:2/3;background:#09172b;border:2px solid #5cdff4;border-radius:20px;box-shadow:0 0 26px #23c9e940;touch-action:none}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:min(100%,310px);margin-top:8px}
.controls button{padding:6px 0;font-size:19px;user-select:none;touch-action:none}
.panel{padding:10px;border:1px solid #314b70;border-radius:16px;background:#0a1830dd}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat strong{font-size:22px}
.next{font-size:12px;color:var(--muted);margin-top:13px}
.preview{display:flex;min-height:26px;align-items:center;margin-top:7px}
.preview i{width:25px;height:22px;border:2px solid #ffffff88}
.preview i:first-child{border-radius:15px 0 0 15px}
.preview i:last-child{border-radius:0 15px 15px 0}
.preview b{font-size:12px;color:#dfb3ff}
#notice{font-size:12px;min-height:34px;color:#8dfff0;margin-top:10px}
.hint{font-size:11px;line-height:1.5;color:var(--muted)}
.footer{text-align:center;font-size:11px;color:var(--muted);margin:12px 0}
.friends{position:absolute;right:0;top:15%;display:grid;gap:20px}
.friend{font-size:36px;width:48px;text-align:center;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 5px 3px #0008)}
.friend:nth-child(2){animation-delay:-.8s}
.friend:nth-child(3){animation-delay:-1.6s}
.friend.hurt{animation:hurt .8s ease both}
body.stopped .friend{animation-play-state:paused}
@keyframes bob{50%{transform:translateY(-6px) rotate(7deg)}}
@keyframes hurt{40%{transform:translateY(10px) rotate(75deg)}}
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:15px;background:radial-gradient(ellipse at 50% 20%,#145887bc,transparent 65%),#020a19e8;backdrop-filter:blur(10px);overflow:auto}
.dialog{width:min(100%,530px);max-height:92dvh;overflow:auto;padding:26px;text-align:center;border:1px solid #70ddff99;border-radius:25px;background:linear-gradient(140deg,#0b3a5bed,#101d4bee);box-shadow:0 0 30px #3ecffb4f,0 24px 90px #0009}
.dialog h2{margin:0 0 14px}
.dialog p{line-height:1.5;color:#c4e3f4}
.menu-logo{display:block;width:min(100%,340px);height:180px;object-fit:contain;margin:0 auto 10px;filter:drop-shadow(0 0 12px #4cdcff99)}
.stack{display:grid;gap:10px}
.stack button{border-radius:28px;border:2px solid #50d6ff;font-size:17px;min-height:45px;box-shadow:inset 0 1px 0 #fff5,0 0 10px #17caff35}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.levels button{padding:9px 2px}
.levels small{display:block;font-size:10px;color:#ffdf6b;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0;text-align:left}
.row input[type=range]{width:120px}
.row select{max-width:190px}
.stars{font-size:36px;color:#ffdf6b}
table{border-collapse:collapse;width:100%;text-align:left;margin:15px 0}
td,th{padding:9px 5px;border-bottom:1px solid #ffffff22;overflow-wrap:anywhere}
td:last-child,th:last-child{text-align:right}
.status{font-size:12px;color:#a6bdd7}
#platform-mask{position:fixed;inset:0;z-index:30;background:#031020dd;display:grid;place-items:center;font-size:22px}
#boot{position:fixed;inset:0;z-index:40;background:#071126;display:grid;place-items:center;color:#a6bdd7;font-size:13px;gap:14px;grid-auto-flow:row}
#boot .boot-logo{width:min(300px,70vw);height:110px;object-fit:contain;filter:drop-shadow(0 0 12px #4cdcff99);opacity:.85}
#boot .boot-spinner{width:28px;height:28px;border:3px solid #2a4b70;border-top-color:#70f3ff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:660px){
.app{padding:8px}
.brand{width:min(310px,90vw);height:115px}
.layout{display:flex;flex-direction:column-reverse;gap:8px}
.panel{width:100%;padding:8px 10px}
.stats{grid-template-columns:repeat(4,1fr);gap:5px}
.stat strong{font-size:18px}
.next{display:flex;align-items:center;gap:8px;margin-top:5px}
.preview{margin:0;min-height:22px}
#notice{margin-top:4px;min-height:16px;font-size:11px}
.hint{display:none}
.board-wrap{width:100%;padding-right:42px}
canvas{width:min(100%,440px,max(210px,calc((100dvh - 325px)*.666667)))}
.friend{width:36px;font-size:29px}
.dialog{padding:20px 16px}
.menu-logo{height:145px}
}
@media(prefers-reduced-motion:reduce){.friend{animation:none!important}}
.friends .friend {
  width: 48px;
  height: 62px;
  font-size: 0;
  line-height: 0;
  transform-origin: 50% 88%;
  animation: av-idle 2.6s ease-in-out infinite;
  filter: drop-shadow(0 5px 3px #0008);
}
.friends .friend:nth-child(2) { animation-delay: -.8s; }
.friends .friend:nth-child(3) { animation-delay: -1.6s; }
.friends .friend svg { display: block; width: 100%; height: 100%; overflow: visible; }
.friend .av-angry { opacity: 0; }
.friend .av-happy { opacity: 1; }
.friends .friend.hurt { animation: av-fall 1.65s ease-in-out both; }
.friend.hurt .av-angry { opacity: 1; }
.friend.hurt .av-happy { opacity: 0; }
body.stopped .friends .friend { animation-play-state: paused; }
@keyframes av-idle {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-5px) rotate(4deg); }
}
@keyframes av-fall {
  0%   { transform: translateY(0) rotate(0); }
  15%  { transform: translateY(-7px) rotate(-16deg); }
  34%  { transform: translateY(9px) rotate(78deg); }
  46%  { transform: translateY(9px) rotate(70deg); }
  58%  { transform: translateY(9px) rotate(82deg); }
  70%  { transform: translateY(9px) rotate(72deg); }
  88%  { transform: translateY(-3px) rotate(-12deg); }
  100% { transform: translateY(0) rotate(0); }
}
@media (max-width: 660px) {
  .friends .friend { width: 36px; height: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  .friends .friend { animation: none !important; }
  .friends .friend.hurt { animation: av-expression .6s linear both !important; }
  @keyframes av-expression { from { opacity: .85; } to { opacity: 1; } }
}

function normalizeLang(raw){
  if (!raw) return null;
  const code = String(raw).toLowerCase().replace('_','-').slice(0,2);
  return LOCALES[code] ? code : null;
}

let currentLang = normalizeLang(navigator.language) || 'ru';

function t(key, ...args) {
  const text = LOCALES[currentLang]?.[key] ?? LOCALES.en[key] ?? key;
  return typeof text === 'function' ? text(...args) : text;
}

function applyStaticTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(node => {
    const key = node.dataset.i18n;
    if (node.id === 'pauseButton' && node.dataset.dynamic === '1') return;
    if (node.id === 'levelLabel' && node.dataset.dynamic === '1') return;
    const value = t(key);
    if (node.id === 'settingsButton') node.textContent = '⚙ ' + value;
    else if (node.id === 'pauseButton') node.textContent = 'Ⅱ ' + value;
    else node.textContent = value;
  });
}

const i18nDebug = {
  yaGames: '?',
  sdkRaw: '?',
  sdkNorm: '?',
  navRaw: (navigator.language || '?'),
  navNorm: '?',
  override: '?',
  applied: '?'
};

function renderI18nDebug(){
  const el = document.getElementById('i18n-debug');
  if(!el) return;
  const params = new URLSearchParams(location.search);
  if(!params.has('i18n_debug')) { el.hidden = true; return; }
  el.hidden = false;
  el.textContent =
    'i18n debug\n' +
    'YaGames: '         + i18nDebug.yaGames + '\n' +
    'sdk.i18n.lang: '   + i18nDebug.sdkRaw + ' → ' + i18nDebug.sdkNorm + '\n' +
    'navigator.lang: '  + i18nDebug.navRaw + ' → ' + i18nDebug.navNorm + '\n' +
    'override: '        + i18nDebug.override + '\n' +
    'applied: '         + i18nDebug.applied;
}

function detectLanguage(platformOnly = false) {
  const sdkRaw = sdk?.environment?.i18n?.lang;
  const sdkLang = normalizeLang(sdkRaw);
  const browserLang = normalizeLang(navigator.language);

  const override = save.settings.lang || 'auto';

  i18nDebug.sdkRaw = sdkRaw || '(нет)';
  i18nDebug.sdkNorm = sdkLang || '(не поддерживается)';
  i18nDebug.navNorm = browserLang || '(не поддерживается)';
  i18nDebug.override = platformOnly
    ? 'авто при запуске'
    : override;

  if (!platformOnly && ['ru', 'en'].includes(override)) {
    return override;
  }

  if (sdkRaw) {
    return sdkLang || 'en';
  }

  return browserLang || 'en';
}

function applyLanguage(lang) {
  const normalized = normalizeLang(lang) || 'ru';
  currentLang = normalized;
  document.documentElement.lang = normalized;

  document.title = normalized === 'ru' ? 'Антивирус' : 'Antivirus';

  document.getElementById('platform-mask').textContent =
    t('platformPause');

  document.getElementById('preview').removeAttribute('data-pair');

  const labels = normalized === 'ru'
    ? {
        left: 'Влево',
        right: 'Вправо',
        rotate: 'Поворот',
        soft: 'Ускорение',
        drop: 'Сброс'
      }
    : {
        left: 'Left',
        right: 'Right',
        rotate: 'Rotate',
        soft: 'Soft drop',
        drop: 'Hard drop'
      };

  document.querySelectorAll('[data-act]').forEach(button => {
    button.setAttribute('aria-label', labels[button.dataset.act] || '');
  });

  document.getElementById('board').setAttribute(
    'aria-label',
    normalized === 'ru'
      ? 'Игровое поле: 8 столбцов и 12 строк'
      : 'Game board: 8 columns and 12 rows'
  );

  document.getElementById('dialog').setAttribute(
    'aria-label',
    normalized === 'ru' ? 'Меню игры' : 'Game menu'
  );

  applyStaticTranslations();

  const hintControls = document.getElementById('hintControls');
  const hintRules = document.getElementById('hintRules');
  if (hintControls) hintControls.innerHTML = t('hintControls').replace(/\n/g, '<br>');
  if (hintRules) hintRules.innerHTML = t('hintRules').replace(/\n/g, '<br>');

  const cs = document.getElementById('cloudStatus');
  if (cs && cs.dataset.i18nKey) cs.textContent = t(cs.dataset.i18nKey);

  const pauseBtn = document.getElementById('pauseButton');
  if (pauseBtn && !pauseBtn.disabled) {
    pauseBtn.textContent = paused ? '▶ ' + t('pauseResume') : 'Ⅱ ' + t('pauseTitle');
  }

  i18nDebug.applied = currentLang;
  console.log('[i18n] Применён язык интерфейса:', currentLang);
  renderI18nDebug();
}

const $=id=>document.getElementById(id);
const ctx=$('board').getContext('2d');
const W=8,H=12,N=30,KEY='antivirus-mvp-1';
const COLORS=['#ff557a','#ffe05c','#4daaff'];
const DIR=[[1,0],[0,1],[-1,0],[0,-1]];
const num=(v,min=0,max=1e9)=>Math.max(min,Math.min(max,Number.isFinite(Number(v))?Number(v):min));
const fresh=()=>({unlocked:1,stars:Array(N).fill(0),best:{kills:0,time:0,score:0},settings:{sound:true,music:true,voice:true,buttons:true,sensitivity:30,theme:0,lang:'auto'}});
function normalize(raw){
 const s=fresh();if(!raw||typeof raw!=='object')return s;
 s.unlocked=Math.floor(num(raw.unlocked,1,N));
 s.stars=s.stars.map((_,i)=>Math.floor(num(raw.stars?.[i],0,3)));
 for(let i=0;i<N;i++)if(s.stars[i])s.unlocked=Math.max(s.unlocked,Math.min(N,i+2));
 for(const k of ['kills','time','score'])s.best[k]=num(raw.best?.[k]);
 s.best.kills=Math.floor(s.best.kills);
 const o=raw.settings||{};
 for(const k of ['sound','music','voice','buttons'])s.settings[k]=o[k]!==false;
 s.settings.sensitivity=num(o.sensitivity??30,15,65);
 s.settings.theme=Math.floor(num(o.theme,0,3));
 s.settings.lang=['auto','ru','en'].includes(o.lang)?o.lang:'auto';
 return s;
}
let localOK=true,save=fresh();
try{
 const raw=JSON.parse(localStorage.getItem(KEY)||'null');
 save=normalize(raw);
 if(raw?.settings?.music===undefined){
  const extra=JSON.parse(localStorage.getItem('antivirus-extra-1')||'null');
  if(extra){save.settings.music=extra.music!==false;save.settings.voice=extra.voice!==false;}
  save.settings.theme=Math.floor(num(localStorage.getItem('antivirus-music-theme'),0,3));
 }
}catch{localOK=false;}
function better(a,b){
 return a.kills>b.kills||(a.kills===b.kills&&a.kills>0&&
 (a.time<b.time||(a.time===b.time&&a.score>b.score)));
}
function merge(a,b){
 const out=normalize(a);b=normalize(b);
 out.unlocked=Math.max(out.unlocked,b.unlocked);
 out.stars=out.stars.map((v,i)=>Math.max(v,b.stars[i]));
 if(better(b.best,out.best))out.best={...b.best};
 return out;
}
function writeLocal(){
 try{localStorage.setItem(KEY,JSON.stringify(save));localOK=true;}
 catch{localOK=false;}
}
let sdk=null,player=null,cloudReady=false,dirty=false,saving=false;
let saveTimer=null;
function status(text,key){
 const el=$('cloudStatus');
 el.textContent=text;
 if(key)el.dataset.i18nKey=key;
}
function persist(){
 writeLocal();dirty=true;scheduleCloud();
 if(!cloudReady)status(localOK?t('cloudProgress'):t('cloudNoSave'),localOK?'cloudProgress':'cloudNoSave');
}
function scheduleCloud(){
 clearTimeout(saveTimer);
 if(cloudReady)saveTimer=setTimeout(flushCloud,3500);
}
async function flushCloud(){
 if(!cloudReady||!dirty||saving)return;
 saving=true;dirty=false;
 try{
  const data={version:2,unlocked:save.unlocked,stars:[...save.stars],best:{...save.best}};
  await player.setData({antivirusProgress:data},true);
  status(t('cloudSave'),'cloudSave');
 }catch(e){dirty=true;status(t('cloudError'),'cloudError');console.warn(e);}
 finally{saving=false;if(dirty){clearTimeout(saveTimer);saveTimer=setTimeout(flushCloud,15000);}}
}
let connecting=false;
async function connectPlayer(){
 if(!sdk||connecting)return;
 connecting=true;
 try{
  const p=await sdk.getPlayer({scopes:false});
  if(!p.isAuthorized()){
   player=p;status(t('cloudLogin'),'cloudLogin');return;
  }
  status(t('cloudLoading'),'cloudLoading');
  const data=await p.getData(['antivirusProgress']);
  player=p;save=merge(save,data.antivirusProgress);
  writeLocal();cloudReady=true;dirty=true;applySettings();
  status(t('cloudCloud'),'cloudCloud');
  scheduleCloud();
  if(screen==='menu')menu();
  if(screen==='levels')levelsMenu();
 }catch(e){
  cloudReady=false;
  status(t('cloudOffline'),'cloudOffline');
  console.warn(e);
 }finally{connecting=false;}
}
async function login(){
 if(!sdk){status(t('cloudSDK'),'cloudSDK');return;}
 try{
  if(!player?.isAuthorized())await sdk.auth.openAuthDialog();
  await connectPlayer();
 }catch{
  status(t('loginCancelled'), 'loginCancelled');
 }
 if(screen==='menu')menu();
}

let moveCleared=0,bombAwarded=false;

let reported=false,platformWasPlaying=false;

 $('pauseButton').disabled=!running;
 $('pauseButton').dataset.dynamic='1';

function record(){
 if(mode!=='endless')return;
 const b={kills,time:elapsed,score};
 if(better(b,save.best)){save.best=b;persist();}

function tell(key,...args){
 const text = t(key,...args);
 $('notice').textContent=text;
 noticeLeft=4;
}
function findMatches(){
 const found=new Set();
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const c=grid[y][x];if(!c)continue;
  for(const [dx,dy]of [[1,0],[0,1]]){
   if(grid[y-dy]?.[x-dx]?.color===c.color)continue;
   const line=[];let xx=x,yy=y;
   while(xx<W&&yy<H&&grid[yy][xx]?.color===c.color){line.push(yy*W+xx);xx+=dx;yy+=dy;}
   if(line.length>=4)line.forEach(i=>found.add(i));
  }
 }
 return [...found];
}
function addViruses(n,top){
 const spaces=[];
 for(let y=top;y<H;y++)for(let x=0;x<W;x++)if(!grid[y][x])spaces.push([x,y]);
 for(let i=spaces.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[spaces[i],spaces[j]]=[spaces[j],spaces[i]];}
 let added=0;
 for(const [x,y]of spaces){
  if(added>=n)break;
  const color=Math.floor(Math.random()*3);
  for(let k=0;k<3;k++){
   grid[y][x]={type:'virus',color:(color+k)%3};
   if(!findMatches().length){added++;break;}
   grid[y][x]=null;
  }
 }
 return added;
}
function start(m,n){
 if(platformPaused||document.hidden)return;
 if(m==='campaign'&&(!Number.isInteger(n)||n<1||n>N||n>save.unlocked))return;
 mode=m;level=n;wave=1;
 grid=Array.from({length:H},()=>Array(W).fill(null));
 active=null;next=pair();serial=1;pendingBombs=0;
 score=kills=elapsed=moves=fall=phase=combo=0;matches=[];particles=[];
 moveCleared=0;bombAwarded=false;
 running=true;paused=false;state='fall';last=performance.now();
 document.querySelectorAll('.friend').forEach(e=>e.classList.remove('hurt'));
 const d=difficulty(n);addViruses(m==='campaign'?d.viruses:14,m==='campaign'?d.top:6);
 clearInput();hide();spawn();updateHUD();tell('noticeStart');
}
function cells(p=active){
 if(!p)return[];
 const [dx,dy]=DIR[p.rotation];
 return[{x:p.x,y:p.y,color:p.colors[0]},{x:p.x+dx,y:p.y+dy,color:p.colors[1]}];
}
function valid(p){return !!p&&cells(p).every(c=>c.x>=0&&c.x<W&&c.y>=0&&c.y<H&&!grid[c.y][c.x]);}
function spawn(){
 const bomb=pendingBombs>0;
 active={x:3,y:0,rotation:0,colors:bomb?[0,2]:next,id:serial++,bomb};
 if(bomb){pendingBombs--;tell('noticeBomb');bombSpawnSound();}else next=pair();
 fall=0;combo=0;state='fall';
 if(!valid(active)){active=null;finish(false);}
}
function move(dx,dy){
 if(!active)return false;
 const p={...active,x:active.x+dx,y:active.y+dy};
 if(!valid(p))return false;active=p;return true;
}
function rotate(){
 if(!active)return;
 for(const [dx,dy]of [[0,0],[-1,0],[1,0],[0,-1],[0,1]]){
  const p={...active,x:active.x+dx,y:active.y+dy,rotation:(active.rotation+1)%4};
  if(valid(p)){active=p;sound('turn');return;}
 }
}
function area(p){return{x:Math.max(0,Math.min(W-4,p.x-1)),y:Math.max(0,Math.min(H-4,p.y-1))};}
function lock(){
 if(!active)return;
 const p=active;active=null;moves++;phase=0;combo=0;
 moveCleared=0;bombAwarded=false;
 if(p.bomb){
  const a=area(p);matches=[];
  for(let y=a.y;y<a.y+4;y++)for(let x=a.x;x<a.x+4;x++)if(grid[y][x])matches.push(y*W+x);
  combo=1;erase(true);state='gravity';explosionSound();tell('noticeClear');
 }else{
  for(const c of cells(p))grid[c.y][c.x]={type:'pill',color:c.color,link:p.id};
  state='scan';sound('drop');
 }
}
function action(a){
 if(!playable()||state!=='fall'||!active)return;
 if(a==='left'){if(move(-1,0))sound('move');}
 if(a==='right'){if(move(1,0))sound('move');}
 if(a==='rotate')rotate();
 if(a==='soft'){if(!move(0,1))lock();fall=0;}
 if(a==='drop'){while(move(0,1)){}lock();}
 updateHUD();
}
function gravity(){
 const links=new Map();
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const c=grid[y][x];if(c?.type!=='pill')continue;
  if(!links.has(c.link))links.set(c.link,[]);
  links.get(c.link).push({x,y,c});
 }
 const groups=[...links.values()].sort((a,b)=>Math.max(...b.map(c=>c.y))-Math.max(...a.map(c=>c.y)));
 let moved=false;
 for(const g of groups){
  const own=new Set(g.map(c=>c.y*W+c.x));
  if(!g.every(c=>c.y+1<H&&(!grid[c.y+1][c.x]||own.has((c.y+1)*W+c.x))))continue;
  for(const c of g)grid[c.y][c.x]=null;
  for(const c of g)grid[c.y+1][c.x]=c.c;
  moved=true;
 }
 return moved;
}
function erase(bomb=false){
 let removed=0,cleared=0;const affected=new Set();
 for(const i of new Set(matches)){
  const x=i%W,y=Math.floor(i/W),c=grid[y][x];if(!c)continue;
  cleared++;if(c.type==='virus'){removed++;affected.add(c.color);}
  for(let n=0;n<7;n++)particles.push({x:x*50+25,y:y*50+25,vx:(Math.random()-.5)*170,vy:(Math.random()-.7)*180,life:.55,color:COLORS[c.color]});
  grid[y][x]=null;
 }
 kills+=removed;score+=removed*10*Math.max(1,Math.min(combo,4));matches=[];
 moveCleared+=cleared;
 affected.forEach(i=>{
  const node=document.querySelectorAll('.friend')[i];
  node.classList.remove('hurt');void node.offsetWidth;node.classList.add('hurt');
 });
 if(bomb){
 } else if(moveCleared>=8 && !bombAwarded){
  bombAwarded=true;pendingBombs++;praise();tell('noticeBombEarned',moveCleared);
 } else {
  sound('clear');
  tell(combo>1?'noticeCombo':'noticeKilled', combo>1?Math.min(combo,4):removed);
 }
 record();
}
function resolution(dt){
 phase+=dt;
 if(state==='scan'){
  matches=findMatches();phase=0;
  if(matches.length){combo++;state='flash';}
  else if(!count()){
   if(mode==='campaign')finish(true);
   else{wave++;if(!addViruses(Math.min(36,12+wave*2),4))finish(false);else{tell('noticeWave',wave);spawn();}}
  }else spawn();
 }else if(state==='flash'&&phase>=.28){erase();state='gravity';phase=0;}
 else if(state==='gravity'&&phase>=.075){phase=0;if(!gravity())state='scan';}
}
function finish(won){
 running=false;paused=false;active=null;state='end';clearInput();record();
 let text='';
 if(won){
  const target=difficulty(level).target;
  const stars=elapsed<=target?3:elapsed<=target*1.7?2:1;
  save.stars[level-1]=Math.max(save.stars[level-1],stars);
  save.unlocked=Math.max(save.unlocked,Math.min(N,level+1));persist();
  text=`<div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>`;
 }
 show(`<h2>${won?t('endWin'):t('endLose')}</h2>${text}
 <p>${t('endScore')}: ${score}<br>${t('endViruses')}: ${kills}<br>${t('endTime')}: ${timeText(elapsed)}</p>
 <div class="stack">${won&&level<N?btn(t('endNext'),'next',true):''}
 ${btn(t('endRetry'),'restart')}${btn(t('endMenu'),'menu')}</div>`,'end');
 sound(won?'win':'lose');
}

function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function drawCell(x,y,c,alpha=1){
 ctx.save();ctx.globalAlpha=alpha;
 const px=x*50+25,py=y*50+25,color=COLORS[c.color];
 ctx.translate(px,py);
 if(c.type==='virus'){
  ctx.rotate(Math.sin(clock*2+x+y)*.07);
  ctx.strokeStyle=color;ctx.lineWidth=4;ctx.fillStyle=color;
  for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(a)*13,Math.sin(a)*13);ctx.lineTo(Math.cos(a)*21,Math.sin(a)*21);ctx.stroke();circle(Math.cos(a)*21,Math.sin(a)*21,2);ctx.fill();}
  circle(0,0,15);ctx.fill();ctx.fillStyle='white';
  circle(-5,-3,4.5);ctx.fill();circle(5,-3,4.5);ctx.fill();ctx.fillStyle='#102039';
  circle(-4,-2,2);ctx.fill();circle(6,-2,2);ctx.fill();ctx.strokeStyle='#102039';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,4,5,0,Math.PI);ctx.stroke();
 }else{
  const g=ctx.createLinearGradient(-15,-20,15,20);g.addColorStop(0,'white');g.addColorStop(.25,color);g.addColorStop(1,color+'88');
  ctx.fillStyle=g;circle(0,0,19);ctx.fill();ctx.strokeStyle='#ffffffaa';ctx.lineWidth=1.5;ctx.stroke();
 }
 ctx.restore();
}
function connection(a,b,alpha=1,bomb=false){
 ctx.save();ctx.globalAlpha=alpha;
 const ax=a.x*50+25,ay=a.y*50+25,bx=b.x*50+25,by=b.y*50+25;
 const g=ctx.createLinearGradient(ax,ay,bx,by);
 g.addColorStop(0,bomb?'#eccbff':COLORS[a.color]);g.addColorStop(1,bomb?'#8651e9':COLORS[b.color]);
 ctx.strokeStyle=g;ctx.lineWidth=bomb?38:28;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
 if(bomb){ctx.fillStyle='white';ctx.font='bold 26px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✦',(ax+bx)/2,(ay+by)/2);}
 ctx.restore();
}
function drawPiece(p,alpha){
 const c=cells(p);if(!c.length)return;
 connection(c[0],c[1],alpha,p.bomb);
 if(!p.bomb)c.forEach(v=>drawCell(v.x,v.y,{type:'pill',color:v.color},alpha));
}
function draw(){
 const g=ctx.createLinearGradient(0,0,400,600);g.addColorStop(0,'#0c2240');g.addColorStop(1,'#081326');
 ctx.fillStyle=g;ctx.fillRect(0,0,400,600);ctx.strokeStyle='#70d8ff12';ctx.lineWidth=1;
 for(let x=1;x<W;x++){ctx.beginPath();ctx.moveTo(x*50,0);ctx.lineTo(x*50,600);ctx.stroke();}
 for(let y=1;y<H;y++){ctx.beginPath();ctx.moveTo(0,y*50);ctx.lineTo(400,y*50);ctx.stroke();}
 const links=new Map();
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(c?.type==='pill'){if(!links.has(c.link))links.set(c.link,[]);links.get(c.link).push({x,y,color:c.color});}}
 for(const group of links.values())if(group.length===2)connection(group[0],group[1]);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x])drawCell(x,y,grid[y][x]);
 if(active){
  const ghost={...active};while(valid({...ghost,y:ghost.y+1}))ghost.y++;
  if(active.bomb){
   const a=area(ghost);ctx.save();ctx.fillStyle='#bd87ff25';ctx.strokeStyle='#dfbaff';ctx.setLineDash([7,5]);
   ctx.fillRect(a.x*50,a.y*50,200,200);ctx.strokeRect(a.x*50+2,a.y*50+2,196,196);ctx.restore();
  }
  drawPiece(ghost,.18);drawPiece(active,1);
 }
 if(state==='flash'){ctx.fillStyle=`rgba(255,255,255,${.35+.4*Math.sin(phase*35)**2})`;for(const i of matches)ctx.fillRect(i%W*50+2,Math.floor(i/W)*50+2,46,46);}
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.55);ctx.fillStyle=p.color;circle(p.x,p.y,3);ctx.fill();}
 ctx.globalAlpha=1;
}
function frame(now){
 const dt=Math.min((now-last)/1000,.1);last=now;
 if(playable()){
  elapsed+=dt;clock+=dt;
  if(noticeLeft>0){noticeLeft-=dt;if(noticeLeft<=0)$('notice').textContent='';}
  if(buttonHold&&now>=buttonHold.at){action(buttonHold.act);if(buttonHold)buttonHold.at=now+75;}
  if(state==='fall'&&active){
   const interval=mode==='campaign'?Math.max(.22,difficulty(level).interval-Math.min(.1,elapsed*.0003)):Math.max(.15,.92-wave*.043-elapsed*.00065);
   fall+=dt;
   if(fall>=(pressed.has('ArrowDown')||pressed.has('KeyS')?.055:interval)){
    fall=0;if(!move(0,1))lock();
   }
  }else resolution(dt);
  for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;}
  particles=particles.filter(p=>p.life>0);
 }
 hudTick+=dt;if(hudTick>.1){hudTick=0;updateHUD();}
 draw();requestAnimationFrame(frame);
}
let audio=null,musicBus=null,effectsBus=null,noteAt=0,musicStep=0;
function initAudio(){
 if(platformPaused||document.hidden)return;
 try{
  if(!audio){
   const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
   audio=new C();musicBus=audio.createGain();effectsBus=audio.createGain();
   musicBus.gain.value=effectsBus.gain.value=0;musicBus.connect(audio.destination);effectsBus.connect(audio.destination);
  }
  if(audio.state==='suspended')audio.resume().catch(()=>{});
  syncAudio();
 }catch{}
}
function syncAudio(){
 if(!audio)return;
 const now=audio.currentTime,blocked=paused||platformPaused||document.hidden;
 for(const [bus,value]of [[musicBus,!blocked&&running&&save.settings.music?.16:0],[effectsBus,!blocked&&save.settings.sound?.3:0]]){
  bus.gain.cancelScheduledValues(now);bus.gain.setValueAtTime(value,now);
 }
}
function tone(f,d,t,b,type='sine',vol=.15){
 if(!audio||!b)return;
 const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(b);o.start(t);o.stop(t+d+.03);o.onended=()=>{o.disconnect();g.disconnect();};
}
function sound(kind){
 if(!audio||paused||platformPaused||document.hidden||!save.settings.sound)return;
 const notes={move:[310],turn:[470,630],drop:[240],clear:[523,659,784],praise:[523,659,784,1047],bomb:[160,95,65,330],win:[523,659,784,1047],lose:[330,277,220]}[kind]||[440];
 notes.forEach((f,i)=>tone(f,.16,audio.currentTime+i*.075,effectsBus));
}
function bombSpawnSound(){
 if(!audio||paused||platformPaused||document.hidden||!save.settings.sound)return;
 const now=audio.currentTime;
 const o=audio.createOscillator(),g=audio.createGain();
 o.type='sine';
 o.frequency.setValueAtTime(180,now);
 o.frequency.exponentialRampToValueAtTime(860,now+.32);
 g.gain.setValueAtTime(.0001,now);
 g.gain.exponentialRampToValueAtTime(.22,now+.02);
 g.gain.exponentialRampToValueAtTime(.0001,now+.4);
 o.connect(g);g.connect(effectsBus);
 o.start(now);o.stop(now+.42);
 o.onended=()=>{o.disconnect();g.disconnect();};
}
function explosionSound(){
 if(!audio||paused||platformPaused||document.hidden||!save.settings.sound)return;
 const now=audio.currentTime;
 const osc=audio.createOscillator(),g=audio.createGain();
 osc.type='sawtooth';
 osc.frequency.setValueAtTime(190,now);
 osc.frequency.exponentialRampToValueAtTime(38,now+.55);
 g.gain.setValueAtTime(.0001,now);
 g.gain.exponentialRampToValueAtTime(.55,now+.012);
 g.gain.exponentialRampToValueAtTime(.0001,now+.72);
 osc.connect(g);g.connect(effectsBus);
 osc.start(now);osc.stop(now+.76);
 osc.onended=()=>{osc.disconnect();g.disconnect();};
 const dur=.55;
 const buffer=audio.createBuffer(1,Math.floor(audio.sampleRate*dur),audio.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++){
  const env=Math.pow(1-i/data.length,2.6);
  data[i]=(Math.random()*2-1)*env;
 }
 const src=audio.createBufferSource();src.buffer=buffer;
 const filt=audio.createBiquadFilter();filt.type='lowpass';
 filt.frequency.setValueAtTime(1400,now);
 filt.frequency.exponentialRampToValueAtTime(140,now+dur);
 const ng=audio.createGain();ng.gain.value=.55;
 src.connect(filt);filt.connect(ng);ng.connect(effectsBus);
 src.start(now);src.stop(now+dur);
 src.onended=()=>{src.disconnect();filt.disconnect();ng.disconnect();};
 const w=audio.createOscillator(),wg=audio.createGain();
 w.type='sine';
 w.frequency.setValueAtTime(950,now);
 w.frequency.exponentialRampToValueAtTime(110,now+.38);
 wg.gain.setValueAtTime(.0001,now);
 wg.gain.exponentialRampToValueAtTime(.14,now+.02);
 wg.gain.exponentialRampToValueAtTime(.0001,now+.42);
 w.connect(wg);wg.connect(effectsBus);
 w.start(now);w.stop(now+.44);
 w.onended=()=>{w.disconnect();wg.disconnect();};
}
function praise() {
  sound('praise');

  if (
    !save.settings.voice ||
    !save.settings.sound ||
    !playable() ||
    !('speechSynthesis' in window)
  ) return;

  const voice = speechSynthesis.getVoices().find(v =>
    v.localService && normalizeLang(v.lang) === currentLang
  );

  if (!voice) return;

  stopSpeech();

  const phrase = new SpeechSynthesisUtterance(t('praiseText'));
  phrase.voice = voice;
  phrase.lang = voice.lang;
  phrase.volume = .7;

  speechSynthesis.speak(phrase);
}
function resetMusic(){
 noteAt=0;musicStep=0;if(!audio)return;
 musicBus.disconnect();musicBus=audio.createGain();musicBus.connect(audio.destination);syncAudio();
}
setInterval(()=>{
 if(!audio||audio.state!=='running'||!playable()||!save.settings.music){noteAt=0;return;}
 const t=themes[save.settings.theme],now=audio.currentTime;if(noteAt<now)noteAt=now+.04;
 while(noteAt<now+.18){
  const chord=t.chords[Math.floor(musicStep/8)%4];
  tone(chord[[0,1,2,1,0,2,1,2][musicStep%8]%chord.length]*2,t.step*1.7,noteAt,musicBus,t.type,.12);
  if(musicStep%8===0)chord.forEach(f=>tone(f,t.step*7.5,noteAt,musicBus,'sine',.045));
  noteAt+=t.step;musicStep++;
 }
},90);
document.addEventListener('pointerdown',initAudio,{passive:true});
document.addEventListener('keydown',initAudio);
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'rotate',KeyW:'rotate',Space:'drop'};
document.addEventListener('keydown',e=>{
 if(platformPaused)return;
 if(!$('overlay').hidden){
  if(e.code==='Escape'&&screen==='pause'){e.preventDefault();resume();}
  if(e.code==='Tab'){
   const nodes=[...$('dialog').querySelectorAll('button:not(:disabled),input,select')];
   const first=nodes[0],end=nodes[nodes.length-1];
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();end?.focus();}
   else if(!e.shiftKey&&document.activeElement===end){e.preventDefault();first?.focus();}
  }
  return;
 }
 if(['Escape','KeyP'].includes(e.code)){e.preventDefault();if(!e.repeat)pause();return;}
 if(!playable())return;
 if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();pressed.add(e.code);return;}
 const a=keyMap[e.code];if(!a)return;e.preventDefault();
 if(!e.repeat||a==='left'||a==='right')action(a);
});
document.addEventListener('keyup',e=>pressed.delete(e.code));
document.querySelectorAll('[data-act]').forEach(b=>{
 b.addEventListener('pointerdown',e=>{
  if(!playable())return;e.preventDefault();b.setPointerCapture(e.pointerId);
  const act=b.dataset.act;action(act);
  if(['left','right','soft'].includes(act))buttonHold={act,at:performance.now()+250};
 });
 for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>{buttonHold=null;});
 b.addEventListener('click',e=>{if(e.detail===0)action(b.dataset.act);});
});
const canvas=$('board');
canvas.addEventListener('pointerdown',e=>{
 if(!playable()||state!=='fall'||!active||pointer)return;
 e.preventDefault();canvas.setPointerCapture(e.pointerId);
 const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*400,y=(e.clientY-r.top)/r.height*600;
 pointer={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,at:performance.now(),piece:active.id,onPill:cells().some(c=>Math.abs(x-c.x*50-25)<34&&Math.abs(y-c.y*50-25)<34)};
});
canvas.addEventListener('pointermove',e=>{
 if(!pointer||pointer.id!==e.pointerId||!playable())return;
 const p=pointer,dx=e.clientX-p.x,dy=e.clientY-p.y,t=save.settings.sensitivity;
 if(Math.max(Math.abs(dx),Math.abs(dy))<t)return;
 p.moved=true;clearTimeout(tapTimer);lastTap=0;
 const a=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'soft':'rotate');
 const n=a==='rotate'?1:Math.min(12,Math.floor(Math.max(Math.abs(dx),Math.abs(dy))/t));
 for(let i=0;i<n;i++){if(active?.id!==p.piece)break;action(a);}
 p.x=e.clientX;p.y=e.clientY;
});
canvas.addEventListener('pointerup',e=>{
 if(!pointer||pointer.id!==e.pointerId)return;
 const p=pointer;pointer=null;const now=performance.now();
 if(!playable()||p.moved||now-p.at>450||active?.id!==p.piece)return;
 if(lastTap&&now-lastTap<280){clearTimeout(tapTimer);lastTap=0;action('drop');}
 else{lastTap=now;tapTimer=setTimeout(()=>{if(p.onPill&&active?.id===p.piece)action('rotate');lastTap=0;},280);}
});

async function boot() {
  let sdkLoaded = false;

  i18nDebug.yaGames =
    typeof window.YaGames === 'undefined' ? 'нет' : 'есть';

  if (window.YaGames) {
    try {
      sdk = await window.YaGames.init();
      sdkLoaded = true;

      console.info(
        '[i18n] Язык платформы:',
        sdk.environment?.i18n?.lang
      );
    } catch (error) {
      console.warn('[SDK] Не удалось инициализировать:', error);
    }
  }

  applyLanguage(detectLanguage(true));
  applySettings();

  // Применяем переводы и запускаем игровой цикл ТОЛЬКО ПОСЛЕ инициализации SDK
  applyStaticTranslations();
  $('cloudStatus').textContent = t('cloudProgress');
  updateHUD();
  requestAnimationFrame(frame);

  status(
    t(localOK ? 'cloudLocal' : 'cloudNoSave'),
    localOK ? 'cloudLocal' : 'cloudNoSave'
  );

  if (sdkLoaded) {
    try {
      sdk.on('game_api_pause', platformPause);
      sdk.on('game_api_resume', platformResume);
    } catch (error) {
      console.warn('[SDK] Подписка на события:', error);
    }
  } else {
    status(t('cloudSDK'), 'cloudSDK');
  }

  menu();
  
  // Показываем интерфейс только после применения языка
  $('app').hidden = false;
  $('boot').hidden = true;
  renderI18nDebug();

  await new Promise(resolve => {
    requestAnimationFrame(() => requestAnimationFrame(resolve));
  });

  if (sdkLoaded) {
    try {
      sdk.features.LoadingAPI?.ready();
    } catch (error) {
      console.warn('[SDK] LoadingAPI:', error);
    }

    connectPlayer();
  }

  // ---- Playgama Bridge Integration ----
  if (window.bridge) {
    try {
      await bridge.initialize();
      console.log('[Playgama] Bridge initialized successfully.');

      // Сообщаем платформе, что игра готова к взаимодействию
      bridge.platform.sendMessage('game_ready');

      // Проверяем, включен ли звук на платформе
      const isAudioEnabled = bridge.platform.isAudioEnabled;
      if (!isAudioEnabled) {
        save.settings.sound = false;
        save.settings.music = false;
        save.settings.voice = false;
        applySettings();
        console.log('[Playgama] Audio is disabled by platform settings.');
      }

      // Подписываемся на события платформы
      bridge.platform.on('pause', () => {
        console.log('[Playgama] Platform pause event received.');
        platformPause();
      });
      bridge.platform.on('resume', () => {
        console.log('[Playgama] Platform resume event received.');
        platformResume();
      });
      bridge.platform.on('audio_enabled', () => {
        console.log('[Playgama] Audio enabled event received.');
        save.settings.sound = true;
        save.settings.music = true;
        save.settings.voice = true;
        applySettings();
      });
      bridge.platform.on('audio_disabled', () => {
        console.log('[Playgama] Audio disabled event received.');
        save.settings.sound = false;
        save.settings.music = false;
        save.settings.voice = false;
        applySettings();
      });
    } catch (error) {
      console.warn('[Playgama] Bridge initialization failed:', error);
    }
  } else {
    console.warn('[Playgama] Bridge SDK not found. Game will run in local mode.');
  }
}

// Запуск (без преждевременной отрисовки)
boot();
