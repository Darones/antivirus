<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eef2f7">
<link rel="icon" href="data:,">
<title>Антивирус</title>
<style>
:root{
  --bg-1:#eef2f7;--bg-2:#d9e2ec;--panel:#ffffff;--panel-2:#f8fafc;
  --border:#cbd5e1;--border-2:#e2e8f0;--text:#0f172a;--muted:#64748b;
  --accent:#6366f1;--accent-2:#ec4899;--yellow:#f59e0b;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 4px 16px rgba(15,23,42,.08);
  --shadow-lg:0 12px 40px rgba(15,23,42,.15);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  color:var(--text);background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
  overflow:hidden;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:var(--text);cursor:pointer;border:none;background:none;padding:0;touch-action:manipulation;font-family:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

.app{
  max-width:560px;margin:0 auto;
  height:100dvh;max-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 4px) 8px calc(env(safe-area-inset-bottom) + 6px);
  display:flex;flex-direction:column;gap:5px;overflow:hidden;
}

.duel-bar{
  display:flex;gap:10px;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  border:1px solid #f59e0b;border-radius:10px;
  padding:5px 10px;flex-shrink:0;
  font-size:12px;font-weight:800;color:#78350f;
}
.duel-opp-name{white-space:nowrap;flex:1}
.duel-opp-count{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px}

.mini-opp{
  grid-column:2;grid-row:1 / span 2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  border:2px solid #f59e0b;border-radius:16px;
  box-shadow:var(--shadow);padding:3px;
  min-height:104px;
  min-width:70px;
}
.mini-opp canvas{
  display:block;width:60px;height:90px;
  background:#fff;border-radius:3px;
  max-width:100%;max-height:100%;
}
body:not(.duel-mode) .mini-opp{display:none}

.menu-logo{
  display:block;
  width:min(100%,260px);
  height:auto;
  max-height:130px;
  margin:0 auto 6px;
  object-fit:contain;
}

.duel-toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(15,23,42,.9);color:#fff;padding:10px 18px;border-radius:99px;
  font-size:13px;font-weight:700;z-index:500;opacity:0;transition:.25s;
  pointer-events:none;backdrop-filter:blur(8px);max-width:80vw;text-align:center;
}
.duel-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.top-bar{
  display:grid;
  grid-template-columns:repeat(4,1fr) 34px 34px;
  gap:3px;padding:4px 5px;
  background:var(--panel);border:1px solid var(--border-2);
  border-radius:12px;box-shadow:var(--shadow-sm);
  align-items:center;flex-shrink:0;
}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0;overflow:hidden}
.stat strong{font-size:14px;font-weight:800;white-space:nowrap}
.stat small{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.icon-btn{
  width:34px;height:34px;border-radius:9px;
  background:var(--panel-2);border:1px solid var(--border-2);
  font-size:15px;display:flex;align-items:center;justify-content:center;
  color:var(--text);
}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{opacity:.4;cursor:default}

.preview-top{
  display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:32px;flex-shrink:0;
  font-size:10px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;
}
.preview{
  display:flex;align-items:center;padding:4px 8px;
  background:var(--panel);border:1px solid var(--border-2);
  border-radius:999px;box-shadow:var(--shadow-sm);min-height:26px;
}
.preview i{
  display:block;width:16px;height:16px;border-radius:50%;
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.15),inset 0 1px 2px rgba(255,255,255,.6);
}
.preview i + i{margin-left:-3px}

.board-area{flex:1;display:flex;flex-direction:column;min-height:0;gap:4px}
.canvas-wrap{
  flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding-right:52px;padding-left:2px;
}
.canvas-inner.shake-light{
  animation: board-shake-light 0.15s ease-in-out;
}
.canvas-inner.shake-medium{
  animation: board-shake-medium 0.25s ease-in-out;
}
.canvas-inner.shake-heavy{
  animation: board-shake-heavy 0.4s ease-in-out;
}
.canvas-inner.shake-overflow{
  animation: board-shake-overflow 0.6s ease-in-out;
}
@keyframes board-shake-light{
  0%,100%{ transform:translate(0,0); }
  25%    { transform:translate(-2px,1px); }
  50%    { transform:translate(2px,-1px); }
  75%    { transform:translate(-1px,2px); }
}
@keyframes board-shake-medium{
  0%,100%{ transform:translate(0,0); }
  20%    { transform:translate(-4px,2px); }
  40%    { transform:translate(4px,-2px); }
  60%    { transform:translate(-3px,-3px); }
  80%    { transform:translate(3px,3px); }
}
@keyframes board-shake-heavy{
  0%,100%{ transform:translate(0,0); }
  15%    { transform:translate(-6px,3px); }
  30%    { transform:translate(6px,-3px); }
  45%    { transform:translate(-5px,-4px); }
  60%    { transform:translate(5px,4px); }
  75%    { transform:translate(-3px,2px); }
  90%    { transform:translate(3px,-2px); }
}
@keyframes board-shake-overflow{
  0%,100%{ transform:translate(0,0); }
  10%    { transform:translate(-8px,4px); }
  20%    { transform:translate(8px,-4px); }
  30%    { transform:translate(-7px,-5px); }
  40%    { transform:translate(7px,5px); }
  50%    { transform:translate(-6px,3px); }
  60%    { transform:translate(6px,-3px); }
  70%    { transform:translate(-4px,2px); }
  80%    { transform:translate(4px,-2px); }
  90%    { transform:translate(-2px,1px); }
}
.character-svg{display:block;margin:0 auto;width:128px;height:auto;max-width:100%}
.character-svg.large{width:200px}
.characters-test-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
.characters-test-grid>div{background:#f8fafc;border-radius:12px;padding:8px;text-align:center}
.characters-test-grid>div>small{display:block;font-size:11px;color:#64748b;margin-top:4px}
.story-card{text-align:center}
.story-card .illustration{margin:0 auto 12px;min-height:180px;display:flex;align-items:center;justify-content:center}
.story-card .illustration svg{width:180px;height:auto;max-width:100%}
.story-card h2{font-size:20px;margin:8px 0 10px}
.story-card .story-text{font-size:15px;line-height:1.55;color:#0f172a;background:#f8fafc;border-radius:12px;padding:12px 14px;margin:8px 0;text-align:left}
.story-card .story-fact{font-size:13px;line-height:1.5;color:#0f172a;background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #f59e0b;border-radius:12px;padding:10px 12px;margin:12px 0;text-align:left}
.story-card .story-fact b{color:#78350f}
.story-card .story-progress{font-size:12px;color:#64748b;margin:8px 0;font-weight:700}
.story-card .story-skip{font-size:12px;color:#64748b;background:none;border:none;padding:6px;margin-top:4px;text-decoration:underline;cursor:pointer}
.story-card .story-skip:active{opacity:0.6}

.score-popup{
  position:absolute;
  font-size:24px; font-weight:900;
  color:#0f172a;
  background:rgba(255,255,255,0.85);
  padding:2px 8px;
  border-radius:8px;
  border:2px solid #0f172a;
  text-shadow:none;
  pointer-events:none;
  z-index:99;
  white-space:nowrap;
  font-family:system-ui, sans-serif;
  transform:translate(-50%,-50%);
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.score-popup.combo{
  color:#78350f;
  background:rgba(254,243,199,0.95);
  border-color:#f59e0b;
  font-size:28px;
}
.score-popup.big{
  color:#7c2d12;
  background:rgba(254,215,170,0.95);
  border-color:#f97316;
  font-size:32px;
}
@keyframes score-float{
  0%  { opacity:0; transform:translate(-50%,-50%) scale(0.6); }
  15% { opacity:1; transform:translate(-50%,-50%) scale(1.1); }
  30% { opacity:1; transform:translate(-50%,-50%) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-150%) scale(1); }
}
.boss-avatar{position:absolute;top:8px;right:8px;width:90px;height:90px;opacity:0.55;pointer-events:none;z-index:4}
.boss-avatar svg{width:100%;height:100%;display:block}
.boss-hint{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(254,243,199,.55),rgba(253,230,138,.55));border:2px solid rgba(245,158,11,.75);border-radius:10px;padding:6px 12px;font-size:12px;font-weight:800;color:#78350f;text-align:center;max-width:88%;z-index:6;box-shadow:0 4px 12px rgba(245,158,11,.25);opacity:0;transition:opacity .3s ease;pointer-events:none;line-height:1.35;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.stat strong#score::before{content:' ';font-size:12px;margin-right:1px}
.stat strong#score{color:#d97706;font-weight:900;font-size:15px}
.boss-hint.show{opacity:1}
@keyframes boss-attack{0%{transform:scale(1) rotate(0)}20%{transform:scale(1.3) rotate(-8deg)}40%{transform:scale(1.3) rotate(8deg)}60%{transform:scale(1.2) rotate(-6deg)}80%{transform:scale(1.1) rotate(4deg)}100%{transform:scale(1) rotate(0)}}

.menu-coins-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 18px;margin:6px auto 10px;
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  border:2px solid #f59e0b;border-radius:999px;
  font-size:16px;font-weight:900;color:#78350f;
  cursor:pointer;transition:transform .1s;
  box-shadow:0 3px 10px rgba(245,158,11,.35);
}
.menu-coins-btn:active{transform:scale(.96)}
.tip-overlay{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,rgba(254,243,199,.97),
    rgba(253,230,138,.97));
  border:2px solid #f59e0b;border-radius:14px;
  padding:14px 18px;text-align:center;
  max-width:92%;z-index:9;line-height:1.55;
  box-shadow:0 6px 20px rgba(245,158,11,.35);
  backdrop-filter:blur(3px);color:#78350f;
  font-size:15px;font-weight:800;
}
.tip-text{margin-bottom:10px}
.tip-ok{
  background:linear-gradient(135deg,#6366f1,#ec4899);
  border:none;color:#fff;padding:8px 22px;border-radius:10px;
  font-size:14px;font-weight:800;cursor:pointer;
  box-shadow:0 3px 10px rgba(99,102,241,.35);font-family:inherit;
}
.tip-ok:active{transform:scale(.96)}
.menu-money-btn{
  position:relative;
  border-radius:14px;
  border:2px solid #f59e0b;
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  color:#78350f;font-size:15px;font-weight:800;
  min-height:48px;padding:10px 14px;
  cursor:pointer;transition:transform .08s;
  font-family:inherit;
}
.menu-money-btn:active{transform:scale(.98)}
.menu-money-btn:disabled{opacity:.6;cursor:default}
.menu-money-btn .dot{
  position:absolute;top:8px;right:10px;
  width:10px;height:10px;background:#ef4444;border-radius:50%;
  box-shadow:0 0 8px #ef4444;
}
.shop-item .price.coin-price{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-weight:900}
.shop-item .price.coin-price:disabled{opacity:.4;background:linear-gradient(135deg,#94a3b8,#64748b)}
/* CSS-иконка монеты */
.s-coins::before{
  content:'';
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fef3c7,#f59e0b 60%,#d97706);
  border:1.5px solid #92400e;
  margin-right:3px;
  vertical-align:-1px;
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.2);
}
.streak-bar .s-coins{position:relative}
/* CSS-иконка бомбы */
.s-bombs::before{
  content:'';
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#6b7280,#1f2937 60%,#000);
  border:1.5px solid #000;
  margin-right:3px;
  vertical-align:-1px;
  position:relative;
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.4);
}
.streak-bar .s-bombs{position:relative}
.streak-bar .s-bombs.empty::before,
.streak-bar .s-bombs.empty::after{
  display:none;
}
/* Искра на бомбе */
.s-bombs::after{
  content:'';
  position:absolute;
  top:-2px;
  right:-1px;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#f59e0b;
  box-shadow:0 0 3px #f59e0b;
}
.streak-bar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  grid-template-rows:auto auto auto;
  gap:4px;
  margin:10px 0;
  align-items:stretch;
}
.streak-bar .s-header,
.streak-bar .s-coins,
.streak-bar .s-bombs{
  text-align:center;
  padding:6px 2px;
  border-radius:8px;
  background:#f1f5f9;
  font-weight:900;
}
.streak-bar .s-header{
  font-size:14px;
  color:#0f172a;
  padding:8px 2px;
}
.streak-bar .s-coins{
  font-size:12px;
  color:#d97706;
  padding:8px 2px;
}
.streak-bar .s-bombs{
  font-size:12px;
  color:#92400e;
  padding:8px 2px;
  min-height:24px;
}
.streak-bar .s-header.past,
.streak-bar .s-coins.past,
.streak-bar .s-bombs.past{
  background:#d1fae5;
  opacity:0.7;
}
.streak-bar .s-header.current,
.streak-bar .s-coins.current,
.streak-bar .s-bombs.current{
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  box-shadow:0 0 0 2px rgba(245,158,11,.35);
}
.streak-bar .s-header.future,
.streak-bar .s-coins.future,
.streak-bar .s-bombs.future{
  opacity:0.5;
}
.combo-popup{
  position:absolute;
  left:50%; top:15%;
  transform:translateX(-50%) scale(0.5);
  font-size:48px; font-weight:900;
  color:#f59e0b;
  text-shadow:0 2px 8px rgba(0,0,0,.35), 0 0 20px rgba(245,158,11,.6);
  pointer-events:none;
  z-index:100;
  opacity:0;
  transition:none;
  font-family:system-ui, sans-serif;
  letter-spacing:1px;
  white-space:nowrap;
}
.combo-popup.show{
  animation:combo-appear 0.5s ease-out forwards;
}
.combo-popup.x3{ color:#f97316; font-size:56px; }
.combo-popup.x4{ color:#ef4444; font-size:64px; }
@keyframes combo-appear{
  0%  { opacity:0; transform:translateX(-50%) scale(0.5); }
  40% { opacity:1; transform:translateX(-50%) scale(1.2); }
  70% { opacity:1; transform:translateX(-50%) scale(1.0); }
  100%{ opacity:0; transform:translateX(-50%) scale(1.0) translateY(-40px); }
}
.canvas-inner{
  position:relative;height:100%;max-height:100%;
  aspect-ratio:2/3;max-width:100%;
}
.duel-countdown{
  position:absolute;inset:0;
  display:grid;place-items:center;
  font-size:96px;font-weight:900;color:#6366f1;
  text-shadow:0 4px 24px rgba(99,102,241,.45);
  pointer-events:none;z-index:5;
  background:rgba(15,23,42,.15);
  border-radius:30px;
  backdrop-filter:blur(3px);
  transition:font-size .15s;
  text-align:center;
  padding:0 16px;
  line-height:1.15;
}
canvas#board{
  display:block;width:100%;height:100%;
  background:#fff;
  border:3px solid var(--border);
  border-radius:30px;
  box-shadow:0 8px 28px rgba(15,23,42,.12),inset 0 0 0 1px rgba(255,255,255,.5);
  touch-action:none;
}
.virus-column{
  position:absolute;left:100%;top:8%;
  margin-left:4px;
  display:flex;flex-direction:column;gap:16px;align-items:center;
}

.friend{
  width:48px;height:60px;
  transform-origin:50% 92%;
  animation:av-idle 2.6s ease-in-out infinite;
  filter:drop-shadow(0 4px 3px rgba(15,23,42,.18));
  will-change:transform,opacity;
}
.friend:nth-child(2){animation-delay:-.85s}
.friend:nth-child(3){animation-delay:-1.7s}
.friend svg{display:block;width:100%;height:100%;overflow:visible}
.friend .av-happy{opacity:1}
.friend .av-shock{opacity:0}
.friend.hurt{animation:av-eliminate 1s cubic-bezier(.5,0,.7,1) both}
.friend.hurt .av-happy{opacity:0}
.friend.hurt .av-shock{opacity:1}
body.stopped .friend{animation-play-state:paused}
@keyframes av-idle{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-5px) rotate(4deg)}
}
@keyframes av-eliminate{
  0%   {transform:translateX(0) scale(1); opacity:1}
  8%   {transform:translateX(-3px) scale(1.05); opacity:1}
  12%  {transform:translateX(3px) scale(1.05)}
  16%  {transform:translateX(-3px) scale(1.05)}
  20%  {transform:translateX(3px) scale(1.05)}
  24%  {transform:translateX(-2px) scale(1.04)}
  28%  {transform:translateX(2px) scale(1.04)}
  32%  {transform:translateX(-2px) scale(1.03)}
  36%  {transform:translateX(2px) scale(1.03)}
  40%  {transform:translateX(0) scale(1.02)}
  50%  {transform:translateX(0) scale(1.1); opacity:1}
  62%  {transform:translateX(0) scale(0.85); opacity:1}
  78%  {transform:translateX(0) scale(0.3) rotate(15deg); opacity:.7}
  90%  {transform:translateX(0) scale(0.05) rotate(-10deg); opacity:0}
  91%  {transform:scale(1.1); opacity:0}
  100% {transform:scale(1); opacity:1}
}
@media (prefers-reduced-motion:reduce){
  .friend{animation:none!important}
  .friend.hurt{animation:av-flash .6s ease both!important}
  @keyframes av-flash{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
}

.notice{
  min-height:16px;font-size:12px;font-weight:700;color:var(--accent);
  text-align:center;flex-shrink:0;
}

.controls-v2{
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto;
  gap:6px;width:100%;max-width:420px;margin:0 auto;flex-shrink:0;
}
.ctrl-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:16px;font-weight:800;color:var(--text);
  background:var(--panel);border:2px solid var(--border-2);
  box-shadow:var(--shadow);min-height:52px;
  font-size:24px;line-height:1;transition:transform .08s;
}
.ctrl-btn:active{transform:scale(.94);background:var(--panel-2)}
.ctrl-btn:disabled{opacity:.35}
.rotate-btn{
  grid-column:3;grid-row:1;min-height:48px;font-size:20px;
  background:linear-gradient(135deg,#e0e7ff,#c7d2fe);
  border-color:#a5b4fc;color:#3730a3;
}
.drop-btn{
  grid-column:1;grid-row:1;min-height:48px;font-size:22px;
  background:linear-gradient(135deg,#dbeafe,#bfdbfe);
  border-color:#93c5fd;color:#1e40af;
}
.ad-btn{
  grid-column:2;grid-row:1;min-height:48px;
  background:linear-gradient(135deg,#d1fae5,#a7f3d0);
  border-color:#34d399;color:#065f46;gap:0;
}
.ad-btn .ad-emoji{font-size:18px;line-height:1}
.ad-btn .ad-plus{font-size:7px;font-weight:800;margin-top:1px;line-height:1.05;text-align:center;letter-spacing:-0.2px}
body.duel-mode .ad-btn{display:none}
body.no-rewarded-ads .ad-btn{display:none}
.left-btn{grid-column:1;grid-row:2}
.right-btn{grid-column:3;grid-row:2}
.bomb-btn{
  grid-column:2;grid-row:2;position:relative;
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  border-color:#f59e0b;color:#92400e;gap:0;

const num = (v,min=0,max=1e9)=>Math.max(min,Math.min(max,Number.isFinite(Number(v))?Number(v):min));
function normalize(raw){
  const s=fresh(); if(!raw||typeof raw!=='object')return s;
  s.unlocked=Math.floor(num(raw.unlocked,1,N));
  s.stars=s.stars.map((_,i)=>Math.floor(num(raw.stars?.[i],0,3)));
  for(let i=0;i<N;i++)if(s.stars[i])s.unlocked=Math.max(s.unlocked,Math.min(N,i+2));
  for(const k of ['kills','time','score'])s.best[k]=num(raw.best?.[k]);
  s.best.kills=Math.floor(s.best.kills);
  s.bombs = Math.floor(num(raw.bombs, 0, 99));
  s.coins = Math.floor(num(raw.coins, 0, 9999999));
  const st=raw.story||{};
  s.story={intro:st.intro===true,boss5:st.boss5===true,boss10:st.boss10===true,boss15:st.boss15===true,boss20:st.boss20===true,boss25:st.boss25===true,boss30:st.boss30===true};
  s.trainingDone = raw.trainingDone === true;
  s.welcomeShown = raw.welcomeShown === true;
  s.dailyStreak = Math.floor(num(raw.dailyStreak, 0, 7));
  s.dailyLastClaim = typeof raw.dailyLastClaim === 'string' ? raw.dailyLastClaim : '';
  s.dailyLastVisit = typeof raw.dailyLastVisit === 'string' ? raw.dailyLastVisit : '';
  s.dailyShare = raw.dailyShare === true;
  s.dailyShareDate = typeof raw.dailyShareDate === 'string' ? raw.dailyShareDate : '';
  const o=raw.settings||{};
  for(const k of ['sound','music','voice'])s.settings[k]=o[k]!==false;
  s.settings.allowShare = o.allowShare === true;
  s.settings.sensitivity=num(o.sensitivity??30,15,65);
  s.settings.musicVolume=num(o.musicVolume??0.7,0,1);
  s.settings.lang=['auto','ru','en'].includes(o.lang)?o.lang:'auto';
  const regularTrackIdxs=MUSIC_TRACKS.map((track,index)=>index).filter(index=>!MUSIC_TRACKS[index].boss);
  const savedMusicTrack=o.musicTrack;
  s.settings.musicTrack=savedMusicTrack==='random'?'random':(regularTrackIdxs.includes(Number(savedMusicTrack))?Number(savedMusicTrack):'random');
  const p=raw.purchases||{};
  s.purchases.remove_ads=!!p.remove_ads;
  s.purchases.unlock_all=!!p.unlock_all;
  return s;
}

let vkReady = false, vkUserId = null, vkLaunchParams = {};
// [PLATFORM-FIX] Уточняет платформу через VKWebAppGetLaunchParams.
// Вызывается после успешного VKWebAppInit.
async function detectPlatform(){
  if(!window.vkBridge) return;
  try{
    const r = await Promise.race([
      vkBridge.send('VKWebAppGetLaunchParams'),
      new Promise((_,rj)=>setTimeout(()=>rj(new Error('launch params timeout')),1500))
    ]);
    const client = String(r?.vk_client || '').toLowerCase();
    if(client === 'ok') { window.Platform.mode = 'ok'; return; }
    const p = String(r?.vk_platform || '').toLowerCase();
    if(p){
      window.Platform.mode = p.includes('ok') ? 'ok' : 'vk';
    }
  }catch(e){
    console.warn('[Platform] getLaunchParams skipped:', e?.message||e);
  }
  console.warn('[Platform] mode =', window.Platform.mode);
}
async function vkInit(){
  if(!window.vkBridge){console.warn('[VK] SDK не загружен');return false;}
  try{
    await Promise.race([
      vkBridge.send('VKWebAppInit'),
      new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),1500))
    ]);
    await detectPlatform();
    const p=__vkSearchParams || new URLSearchParams();
    vkLaunchParams=Object.fromEntries(p);
    vkUserId=p.get('vk_user_id');
    const vkLang=p.get('vk_language');
    if(vkLang&&save.settings.lang==='auto')applyLanguage(vkLang);
    vkReady=true;
    return true;
  }catch(e){console.warn('[VK] init fail:',e.message||e);return false;}
}
async function vkCloudLoad(){
  if(!vkReady)return null;
  try{
    // VK bridge can stay pending indefinitely when the app is opened outside VK
    // or when the storage service is temporarily unavailable.
    const r=await Promise.race([
      vkBridge.send('VKWebAppStorageGet',{keys:['progress']}),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('storage timeout')),1500))
    ]);
    const it=r.keys.find(k=>k.key==='progress');
    if(it && it.value){
      try {
        const parsed = JSON.parse(it.value);
        if(parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) return parsed;
      } catch(e){}
    }
  }catch(e){console.warn('[VK] cloud load skipped:',e.message||e);}
  return null;
}
let cloudTimer=null, cloudDirty=false, cloudSaving=false;
let cloudRetryCount = 0;
const CLOUD_SAVE_TIMEOUT = 3000;
const CLOUD_SAVE_MAX_RETRY = 3;
// [VK-FIX] Сохраняет прогресс с timeout и ограниченным числом повторов.
async function vkCloudSave(){
  if(!vkReady||cloudSaving)return;
  cloudSaving=true; cloudDirty=false;
  let ok = false;
  try{
    const r = await Promise.race([
      vkBridge.send('VKWebAppStorageSet',{key:'progress',value:JSON.stringify({unlocked:save.unlocked,stars:save.stars,best:save.best,purchases:save.purchases,bombs:save.bombs})}),
      new Promise((_,rj)=>setTimeout(()=>rj(new Error('save timeout')), CLOUD_SAVE_TIMEOUT))
    ]);
    if(r && r.result !== false){
      ok = true;
      cloudRetryCount = 0;
      console.warn('[Cloud] save ok');
      setCloudStatus(t('cloudSave'));
      // Через 2 секунды вернуть нейтральный статус.
      clearTimeout(window._cloudStatusTimer);
      window._cloudStatusTimer = setTimeout(()=>{
        setCloudStatus(vkReady ? t('cloudCloud') : t('cloudSDK'));
      }, 2000);
    }
  }catch(e){
    if(e?.message === 'save timeout') console.warn('[VK] StorageSet timeout');
    console.warn('[Cloud] save failed:', e?.message||e);
  }finally{
    cloudSaving=false;
    if(!ok){
      cloudDirty = true;
      if(cloudRetryCount < CLOUD_SAVE_MAX_RETRY){
        cloudRetryCount++;
        console.warn('[Cloud] save retry ' + cloudRetryCount + '/' + CLOUD_SAVE_MAX_RETRY);
        scheduleSave();
      }else{
        console.warn('[Cloud] give up after ' + CLOUD_SAVE_MAX_RETRY + ' retries');
        setCloudStatus(t('cloudError'));
        cloudRetryCount = 0;
      }
    }
  }

function duelConnect(){
  return new Promise((resolve, reject) => {
    if(duelState.socket && duelState.socket.readyState === 1) return resolve();
    const params = new URLSearchParams(location.search);
    const url = WS_URL + '?' + params.toString();
    const ws = new WebSocket(url);
    ws.onopen = () => { duelState.socket = ws; resolve(); };
    ws.onerror = e => reject(e);
    ws.onclose = () => {
      if(duelState.started) showToast(t('duelConnLost'));
    };
    ws.onmessage = ev => {
      try { handleDuelMessage(JSON.parse(ev.data)); }
      catch(e){ console.warn('[Duel] bad msg', e); }
    };
  });
}
function duelSend(msg){
  if(duelState.socket?.readyState === 1) duelState.socket.send(JSON.stringify(msg));

function duelDrawOppBoard(board){
  const c = $('duelOppBoard');
  if(!c) return;
  const cx = c.getContext('2d');
  const cw = c.width / W, ch = c.height / H;
  cx.clearRect(0,0,c.width,c.height);
  if(!board) return;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const cell = board[y]?.[x];
    if(!cell) continue;
    cx.fillStyle = cell.type === 'virus' ? COLORS[cell.color] : '#cbd5e1';
    cx.fillRect(x*cw, y*ch, cw-0.3, ch-0.3);
  }
}

function initBotBoard(){
  const board = Array.from({length:H}, () => Array(W).fill(null));
  const positions = [];
  for(let y = 4; y < H; y++) for(let x = 0; x < W; x++) positions.push([x,y]);
  for(let i = positions.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [positions[i], positions[j]] = [positions[j], positions[i]];
  }
  const target = DUEL_TARGET;
  for(let i = 0; i < target && i < positions.length; i++){
    const [x,y] = positions[i];
    board[y][x] = { type: 'virus', color: Math.floor(Math.random()*3) };
  }
  duelState.botBoard = board;
  duelDrawOppBoard(board);
}

function updateBotBoardRemoveOne(){
  if(!duelState.botBoard) return;
  const viruses = [];
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    if(duelState.botBoard[y][x]) viruses.push([x,y]);
  }
  if(viruses.length === 0) return;
  const [x,y] = viruses[Math.floor(Math.random()*viruses.length)];
  duelState.botBoard[y][x] = null;
  duelDrawOppBoard(duelState.botBoard);
}

function handleDuelMessage(msg){
  switch(msg.type){
    case 'welcome': break;
    case 'queue_waiting':
      duelState.botTimeout = setTimeout(()=>{
        duelState.botMode = true;
        duelState.opponent = { playerId: 'BOT' };
        showToast(t('duelBotFallback'));
        duelStart('bot');
      }, DUEL_BOT_DELAY);
      break;
    case 'queue_cancelled':
      clearTimeout(duelState.botTimeout);
      duelState.botTimeout = null;
      showToast('Отменено');
      break;
    case 'match_found':
      clearTimeout(duelState.botTimeout);
      duelState.roomId = msg.roomId;
      duelState.role = msg.role;
      duelState.opponent = msg.opponent;
      duelStart('online');
      break;
    case 'room_created':
      duelState.roomId = msg.roomId;
      duelShowWaiting();
      break;
    case 'opponent_joined':
      duelState.opponent = msg.opponent;
      duelStart('online');
      break;
    case 'opponent_state':
      duelState.oppViruses = msg.state.viruses || 0;
      duelUpdateProgress();
      if(msg.state.board) duelDrawOppBoard(msg.state.board);
      break;
    case 'garbage_incoming':
      duelEnqueueGarbage(msg.cells);
      break;
    case 'opponent_game_over':
      if(msg.reason === 'target_reached'){
        duelEnd(false, t('duelOppReachedTarget'));
      } else if(msg.reason === 'overflow'){
        duelEnd(true, t('duelOppOverflow'));
      } else {
        duelEnd(true, t('duelOppLeft'));
      }
      break;
    case 'opponent_left':
      duelEnd(true, t('duelOppLeft'));
      break;
    case 'matchmaking_timeout':
      if(!duelState.botMode && !duelState.started){
        duelState.botMode = true;
        duelState.opponent = { playerId: 'BOT' };
        duelStart('bot');
      }
      break;
  }
}

function duelStartBot(){
  duelStopBot();
  initBotBoard();
  duelState.botMoveCount = 0;
  duelState.botGarbageFired = false;

  const scheduleBotMove = () => {
    duelState.botInterval = setTimeout(() => {
      if(!duelState.started || !duelState.botMode) return;
      duelState.botMoveCount++;

      const removeCount = Math.random() < 0.25 ? 2 : 1;
      for(let i = 0; i < removeCount && duelState.oppViruses < DUEL_TARGET; i++){
        duelState.oppViruses++;
        updateBotBoardRemoveOne();
      }
      duelUpdateProgress();

      if(duelState.oppViruses >= DUEL_TARGET){
        duelEnd(false, t('duelBotWin'));

      if(!duelState.botGarbageFired && Math.random() < 0.05){
        duelState.botGarbageFired = true;
        const cells = 2 + Math.floor(Math.random()*2);
        duelEnqueueGarbage(cells);
      }

      scheduleBotMove();
    }, 6000 + Math.random() * 7000);
  };

  scheduleBotMove();
}

function duelEnqueueGarbage(cells){
  cells = Math.max(1, Math.min(cells, DUEL_MAX_GARBAGE));
  playGarbageSound();
  showToast(t('duelGarbage') + cells);
  if(active===null && state==='fall') spawnGarbageCells(cells);
  else duelState.garbageQueue += cells;
}
function playGarbageSound(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!audio){
      audio = new AC();
      musicBus = audio.createGain(); effectsBus = audio.createGain();
      musicBus.gain.value = 0; effectsBus.gain.value = 0;
      musicBus.connect(audio.destination); effectsBus.connect(audio.destination);
    }
    if(audio.state === 'suspended') audio.resume();
    const now = audio.currentTime;
    const seq = [
      { f: 660, t: 0.00, d: 0.08 },
      { f: 880, t: 0.10, d: 0.08 },
      { f: 440, t: 0.22, d: 0.14 }
    ];
    seq.forEach(({f,t,d})=>{
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + t);
      g.gain.exponentialRampToValueAtTime(0.25, now + t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t + d);
      o.connect(g); g.connect(effectsBus);
      o.start(now + t); o.stop(now + t + d + 0.02);
    });
  }catch(e){}
}
function pickGarbageColumns(count){
  const result = new Set();
  for(let i=0;i<count;i++){
    let col, tries = 0;
    do {
      col = Math.floor(Math.random() * W);
      tries++;
    } while((result.has(col) || lastGarbageColumns.includes(col)) && tries < 40);
    result.add(col);
    lastGarbageColumns.push(col);
    if(lastGarbageColumns.length > 3) lastGarbageColumns.shift();
  }
  return [...result];
}
function spawnGarbageCells(count){
  const cols = pickGarbageColumns(count);
  for(const col of cols){
    garbagePieces.push({
      x: col,
      y: -1,
      color: Math.floor(Math.random() * 3),
      fallAcc: 0
    });
  }
}
function updateGarbage(dt){
  for(let i = garbagePieces.length - 1; i >= 0; i--){
    const g = garbagePieces[i];
    g.fallAcc += dt;
    const stepTime = 0.85;
    while(g.fallAcc >= stepTime){
      g.fallAcc -= stepTime;
      const nextY = g.y + 1;
      if(nextY >= H || (g.y >= 0 && grid[nextY] && grid[nextY][g.x])){
        // [DUEL-FIX] type:'garbage' — отрисуется как пилюля, не считается вирусом
        if(g.y >= 0) grid[g.y][g.x] = { type: 'garbage', color: g.color };
        garbagePieces.splice(i, 1);
        break;
      } else {
        g.y = nextY;
        if(g.y >= 0 && grid[g.y] && grid[g.y][g.x]){
          if(g.y - 1 >= 0) grid[g.y - 1][g.x] = { type: 'garbage', color: g.color };
          garbagePieces.splice(i, 1);
          break;
        }
      }
    }
  }
  if(garbagePieces.length === 0 && state === 'waiting_garbage'){
    spawn();
  }
}

function start(m,n){

  mode=m;level=n;wave=1;

  grid=Array.from({length:H},()=>Array(W).fill(null));
  active=null;next=pair();serial=1;
  score=kills=elapsed=moves=fall=phase=combo=0;
  matches=[];particles=[];garbagePieces=[];

      if(pref==='random'||pref==null){musicStart(pickNextTrack());}
      else{const p=Number(pref);if(Number.isFinite(p)&&regularIdxs.includes(p))musicStart(p);else musicStart(pickNextTrack());}
    }
  }
  document.querySelectorAll('.friend').forEach(e=>e.classList.remove('hurt'));
  const d=difficulty(n);
  if(duelMode){
    addViruses(DUEL_TARGET, 4);  // top=4 → вирусы с 5-й строки (индекс 4)
    // [DUEL-FIX] Гарантируем, что верхние 4 строки пусты на старте
    for(let y=0;y<4;y++)for(let x=0;x<W;x++)grid[y][x]=null;
  } else if(m==='campaign'){
    addViruses(d.viruses, d.top);
  } else {
    addViruses(14, 6);
  }
  if(m==='campaign'&&BOSSES[n]&&!duelMode)bossState={...BOSSES[n],active:true};
  else bossState=null;

  if(bossState&&bossState.active){const inner=document.querySelector('.canvas-inner');if(inner)inner.insertAdjacentHTML('beforeend',getBossSVG());}
  clearInput();hide();spawn();updateHUD();tell('noticeStart');
  if(m==='campaign' && n===1 && !duelMode && !save.trainingDone){

  }
  if(bossState&&bossState.active){
    setTimeout(()=>showBossHint(`⚠ ${bossState.name}! Он атакует 3 раза — готовься!`,5000),1200);
  }
  if(__rewardedAdsAvailable) preloadRewarded();
  // [TIMER-FIX] Сбрасывает ввод и базовое время при старте новой игры.
  pointer = null;
  buttonHold = null;
  pressed.clear();
  last = performance.now();
}
function cells(p=active){
  if(!p)return[];
  const [dx,dy]=DIR[p.rotation];
  return[{x:p.x,y:p.y,color:p.colors[0]},{x:p.x+dx,y:p.y+dy,color:p.colors[1]}];
}
function valid(p){return !!p&&cells(p).every(c=>c.x>=0&&c.x<W&&c.y>=0&&c.y<H&&!grid[c.y][c.x]);}
function spawn(){
  if(duelState.garbageQueue > 0){
    spawnGarbageCells(duelState.garbageQueue);
    duelState.garbageQueue = 0;
  }
  if(duelMode && garbagePieces.length > 0){
    active = null;
    state = 'waiting_garbage';
    return;
  }
  active={x:3,y:0,rotation:0,colors:next,id:serial++,bomb:false};
  next=pair();
  fall=0;combo=0;state='fall';
  if(!valid(active)){active=null;finish(false);}
}
function move(dx,dy){if(!active)return false;const p={...active,x:active.x+dx,y:active.y+dy};if(!valid(p))return false;active=p;return true;}
function rotate(){if(!active)return;for(const [dx,dy]of[[0,0],[-1,0],[1,0],[0,-1],[0,1]]){const p={...active,x:active.x+dx,y:active.y+dy,rotation:(active.rotation+1)%4};if(valid(p)){active=p;sound('turn');return;}}}
function bombArea(p){
  const isVertical = (p.rotation === 1 || p.rotation === 3);
  const x = Math.max(0, Math.min(W-3, p.x - 1));
  const yOffset = isVertical ? 0 : -1;
  const y = Math.max(0, Math.min(H-3, p.y + yOffset));
  return {x, y};
}
function lock(){
  if(!active)return;
  const p=active;active=null;moves++;phase=0;combo=0;
  moveCleared=0;bombAwarded=false;
  if(p.bomb){
    const a=bombArea(p);matches=[];
    for(let y=a.y;y<a.y+3;y++)for(let x=a.x;x<a.x+3;x++)if(grid[y][x])matches.push(y*W+x);
    combo=1;erase(true);checkBossWave();state='gravity';explosionSound();shakeBoard('heavy');tell('noticeClear');
  }else{
    for(const c of cells(p))grid[c.y][c.x]={type:'pill',color:c.color,link:p.id};
    state='scan';sound('drop');
  }
}

function action(a){
  if(!playable())return;
  if(a==='bomb'){useBomb();return;}

  if(a==='adbomb'){requestBombViaAd();return;}
  if(state!=='fall'||!active)return;
  if(a==='left'){if(move(-1,0))sound('move');}
  if(a==='right'){if(move(1,0))sound('move');}
  if(a==='rotate')rotate();
  if(a==='soft'){if(!move(0,1))lock();fall=0;}
  if(a==='drop'){while(move(0,1)){}lock();}
  updateHUD();
}

function useBomb(){
  if(!playable()||state!=='fall'||!active)return;
  if(bombsAvailable<=0){tell('noticeNoBombs');return;}
  bombsAvailable--;save.bombs=bombsAvailable;persist();active.bomb=true;updateBombButton();tell('noticeBomb');bombSpawnSound();
}
function gravity(){
  const links=new Map();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(c?.type!=='pill')continue;if(!links.has(c.link))links.set(c.link,[]);links.get(c.link).push({x,y,c});}
  const groups=[...links.values()].sort((a,b)=>Math.max(...b.map(c=>c.y))-Math.max(...a.map(c=>c.y)));
  let moved=false;
  for(const g of groups){
    const own=new Set(g.map(c=>c.y*W+c.x));
    if(!g.every(c=>c.y+1<H&&(!grid[c.y+1][c.x]||own.has((c.y+1)*W+c.x))))continue;
    for(const c of g)grid[c.y][c.x]=null;
    for(const c of g)grid[c.y+1][c.x]=c.c;
    moved=true;
  }
  return moved;
}
function erase(bomb=false){

function speak(text, audioFile){

      voiceAudio = new Audio(audioFile + '.mp3');
      voiceAudio.volume = 1.0;
      const p = voiceAudio.play();
      if(p && p.catch){
        p.catch(e => {
          console.warn('[Voice] mp3 fail, fallback:', e.message);
          speakFallback(text);
        });
      }
      return;
    } catch(e){
      console.warn('[Voice] mp3 error:', e);
    }
  }
  speakFallback(text);
}

function speakFallback(text){
  if(!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const voices = speechSynthesis.getVoices();
    let v = voices.find(vv => vv.lang && vv.lang.startsWith('ru') && /female|жен|alena|alyona|milena|irina/i.test(vv.name));
    if(!v) v = voices.find(vv => vv.lang && vv.lang.startsWith('ru'));
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU';
    u.rate = 0.95;
    u.pitch = 1.15;
    u.volume = 1.0;
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e){}
}

function findMatches(){
  const found=new Set();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=grid[y][x];if(!c)continue;
    for(const [dx,dy]of[[1,0],[0,1]]){
      if(grid[y-dy]?.[x-dx]?.color===c.color)continue;
      const line=[];let xx=x,yy=y;
      while(xx<W&&yy<H&&grid[yy][xx]?.color===c.color){line.push(yy*W+xx);xx+=dx;yy+=dy;}
      if(line.length>=4)line.forEach(i=>found.add(i));
    }
  }
  return [...found];
}
function addViruses(n,top){
  const spaces=[];
  for(let y=top;y<H;y++)for(let x=0;x<W;x++)if(!grid[y][x])spaces.push([x,y]);
  for(let i=spaces.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[spaces[i],spaces[j]]=[spaces[j],spaces[i]];}
  let added=0;
  for(const [x,y]of spaces){
    if(added>=n)break;
    const color=Math.floor(Math.random()*3);
    for(let k=0;k<3;k++){
      grid[y][x]={type:'virus',color:(color+k)%3};
      if(!findMatches().length){added++;break;}
      grid[y][x]=null;
    }
  }
  return added;
}
// [TRAINING-FIX] Гарантирует 3 разных цвета вирусов в обучении.
function ensureTrainingColors(){
  const cells = [];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(grid[y][x]?.type === 'virus') cells.push({x,y});
  }
  if(cells.length < 3) return;
  const distinctCount = () => new Set(cells.map(c => grid[c.y][c.x].color)).size;
  if(distinctCount() >= 3) return;
  let guard = 60;
  while(distinctCount() < 3 && guard-- > 0){
    const shuffled = cells.slice().sort(() => Math.random() - 0.5);
    for(const c of shuffled){
      if(distinctCount() >= 3) break;
      const cur = grid[c.y][c.x].color;
      const candidates = [0,1,2].filter(x => x !== cur).sort(() => Math.random() - 0.5);
      for(const nc of candidates){
        grid[c.y][c.x].color = nc;
        if(!findMatches().length) break;
        grid[c.y][c.x].color = cur;
      }
    }
  }
}

  for(let x=1;x<W;x++){ctx.beginPath();ctx.moveTo(x*50,0);ctx.lineTo(x*50,600);ctx.stroke();}
  for(let y=1;y<H;y++){ctx.beginPath();ctx.moveTo(0,y*50);ctx.lineTo(400,y*50);ctx.stroke();}
  const links=new Map();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(c?.type==='pill'){if(!links.has(c.link))links.set(c.link,[]);links.get(c.link).push({x,y,color:c.color});}}
  for(const group of links.values())if(group.length===2)connection(group[0],group[1]);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x])drawCell(x,y,grid[y][x]);

  for(const gm of garbagePieces){
    // [DUEL-FIX] Мусор рисуем как одинарную пилюлю, не как вирус
    if(gm.y>=0) drawCell(gm.x,gm.y,{type:'garbage',color:gm.color});
    else {
      ctx.save();
      ctx.globalAlpha=0.6;
      ctx.fillStyle=COLORS[gm.color];
      ctx.beginPath();
      ctx.arc(gm.x*50+25, 5, 8, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  if(active){
    const ghost={...active};while(valid({...ghost,y:ghost.y+1}))ghost.y++;
    if(active.bomb){
      const a=bombArea(ghost);
      ctx.save();ctx.fillStyle='rgba(139,92,246,.15)';ctx.strokeStyle='#8b5cf6';
      ctx.setLineDash([6,4]);ctx.fillRect(a.x*50,a.y*50,150,150);
      ctx.strokeRect(a.x*50+2,a.y*50+2,146,146);ctx.restore();
    }
    drawPiece(ghost,.2);drawPiece(active,1);
  }
  if(state==='flash'){ctx.fillStyle=`rgba(255,255,255,${.4+.4*Math.sin(phase*35)**2})`;for(const i of matches)ctx.fillRect(i%W*50+2,Math.floor(i/W)*50+2,46,46);}
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.55);ctx.fillStyle=p.color;circle(p.x,p.y,3);ctx.fill();}
  ctx.globalAlpha=1;
}

let audio=null,musicBus=null,effectsBus=null;

function initAudio(){
  if(platformPaused||document.hidden)return;
  try{
    if(!audio){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      audio=new C();
      musicBus=audio.createGain();effectsBus=audio.createGain();
      musicBus.gain.value=0;effectsBus.gain.value=0;
      musicBus.connect(audio.destination);effectsBus.connect(audio.destination);
    }
    if(audio.state==='suspended')audio.resume().catch(()=>{});
    syncAudio();
  }catch{}
}
let musicAudio = null;
let voiceAudio = null;
let musicCurrentIdx = -1;
let musicFadeTimer = null;
let musicPreviewing = false;
let musicPreviewTimer = null;
function musicStart(idx){
  if(idx<0||idx>=MUSIC_TRACKS.length)return;
  const track=MUSIC_TRACKS[idx];
  if(!musicAudio){musicAudio=new Audio();musicAudio.loop=true;musicAudio.preload='auto';}
  if(musicCurrentIdx===idx&&!musicAudio.paused){musicFadeTo(targetMusicVolume(),250);return;}
  musicAudio.pause();musicAudio.src=track.file;musicAudio.currentTime=0;musicAudio.volume=0;musicCurrentIdx=idx;
  const p=musicAudio.play();
  if(p&&p.catch)p.catch(e=>console.warn('[Music] play failed:',e.message));
  musicFadeTo(targetMusicVolume(),600);
}
function musicStop(){
  if(musicAudio){musicAudio.pause();musicAudio.currentTime=0;}
  musicCurrentIdx=-1;
}
function targetMusicVolume(){
  if(!save.settings.music) return 0;
  if(platformPaused || document.hidden) return 0;
  const userVol = Number(save.settings.musicVolume ?? 0.7);
  const norm = userVol / 0.7;
  if(inSettings) return 0.15 * norm;
  if(paused) return 0;
  if(running && screen === 'game') return 0.35 * norm;
  return 0.15 * norm;
}
function musicFadeTo(target,ms){
  if(!musicAudio)return;
  clearInterval(musicFadeTimer);
  const start=musicAudio.volume,steps=Math.max(1,Math.round(ms/30));let i=0;
  musicFadeTimer=setInterval(()=>{
    i++;const k=i/steps;musicAudio.volume=Math.max(0,Math.min(1,start+(target-start)*k));
    if(i>=steps){clearInterval(musicFadeTimer);musicFadeTimer=null;}
  },30);
}
function syncAudio(){
  if(musicAudio)musicFadeTo(targetMusicVolume(),250);
  if(!audio)return;
  const now=audio.currentTime,blocked=paused||platformPaused||document.hidden;
  const st=(!blocked&&save.settings.sound)?.3:0;
  effectsBus.gain.cancelScheduledValues(now);effectsBus.gain.setValueAtTime(st,now);
}
function pickNextTrack(){
  const regular=MUSIC_TRACKS.map((t,i)=>i).filter(i=>!MUSIC_TRACKS[i].boss);
  if(regular.length===0)return 0;
  let idx=regular[Math.floor(Math.random()*regular.length)];
  if(regular.length>1&&idx===musicCurrentIdx)idx=regular[(regular.indexOf(idx)+1)%regular.length];
  return idx;
}

function tone(f,d,t0,bus,type='sine',vol=.15){
  if(!audio||!bus)return;
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+.015);
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(bus);
  o.start(t0);o.stop(t0+d+.03);
  o.onended=()=>{o.disconnect();g.disconnect();};
}
function sound(kind){
  if(!audio||paused||platformPaused||document.hidden||!save.settings.sound)return;
  const notes={move:[310],turn:[470,630],drop:[240],clear:[523,659,784],praise:[523,659,784,1047],win:[523,659,784,1047],lose:[330,277,220]}[kind]||[440];
  notes.forEach((f,i)=>tone(f,.16,audio.currentTime+i*.075,effectsBus));
}
function bombSpawnSound(){
  if(!audio||!save.settings.sound)return;
  const now=audio.currentTime;
  const o=audio.createOscillator(),g=audio.createGain();
  o.type='sine';o.frequency.setValueAtTime(180,now);o.frequency.exponentialRampToValueAtTime(860,now+.32);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.22,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.4);
  o.connect(g);g.connect(effectsBus);o.start(now);o.stop(now+.42);
}
function explosionSound(){
  if(!audio||!save.settings.sound)return;
  const now=audio.currentTime,dur=.55;
  const buffer=audio.createBuffer(1,Math.floor(audio.sampleRate*dur),audio.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++){const env=Math.pow(1-i/data.length,2.6);data[i]=(Math.random()*2-1)*env;}
  const src=audio.createBufferSource();src.buffer=buffer;
  const filt=audio.createBiquadFilter();filt.type='lowpass';
  filt.frequency.setValueAtTime(1400,now);filt.frequency.exponentialRampToValueAtTime(140,now+dur);
  const ng=audio.createGain();ng.gain.value=.5;
  src.connect(filt);filt.connect(ng);ng.connect(effectsBus);
  src.start(now);src.stop(now+dur);
}
function praise(){

function frame(now){
  const dt=Math.min((now-last)/1000,.1);
  last=now;
  if(playable()){
    elapsed+=dt;clock+=dt;
    if(noticeLeft>0){noticeLeft-=dt;if(noticeLeft<=0)$('notice').textContent='';}
    if(buttonHold&&now>=buttonHold.at){action(buttonHold.act);if(buttonHold)buttonHold.at=now+75;}
    if(duelMode){
      if(garbagePieces.length > 0) updateGarbage(dt);
      if(garbagePieces.length === 0 && state === 'waiting_garbage') spawn();
    }
    if(state==='fall'&&active){
      const rawInterval = mode==='campaign'
        ? Math.max(.22, difficulty(level).interval - Math.min(.1, elapsed*.0003))
        : Math.max(.15, .92 - wave*.043 - elapsed*.00065);
      const interval = Math.max(MIN_FALL_INTERVAL, rawInterval * FALL_SLOWDOWN);
      fall+=dt;
      const soft=pressed.has('ArrowDown')||pressed.has('KeyS')||buttonHold?.act==='soft';
      if(fall>=(soft?.055:interval)){fall=0;if(!move(0,1))lock();}
    }else resolution(dt);
    for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;}
    particles=particles.filter(p=>p.life>0);
  }
  hudTick+=dt;if(hudTick>.1){hudTick=0;updateHUD();updateAdButton();}
  draw();
  requestAnimationFrame(frame);
}

  pointer={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,at:performance.now(),piece:active.id,onPill:cells().some(c=>Math.abs(x-c.x*50-25)<34&&Math.abs(y-c.y*50-25)<34)};

  if(Math.max(Math.abs(dx),Math.abs(dy))<thr)return;
  p.moved=true;clearTimeout(tapTimer);lastTap=0;
  const a=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'soft':'rotate');
  const n=a==='rotate'?1:Math.min(12,Math.floor(Math.max(Math.abs(dx),Math.abs(dy))/thr));
  for(let i=0;i<n;i++){if(active?.id!==p.piece)break;action(a);}
  p.x=e.clientX;p.y=e.clientY;
});

  }

  if(save.settings.lang==='auto'){
    try{applyLanguage(vkLaunchParams.vk_language||navigator.language);}catch{applyLanguage('ru');}
  }else{
    applyLanguage(save.settings.lang);
  }

  updateHUD();updateBombButton();
  requestAnimationFrame(frame);

  // Загружаем облако до показа меню, с таймаутом, чтобы не залипнуть.
  if(vkReady && !localStorage.getItem('antivirus-pending-reset')){
    try{
      const cloud = await Promise.race([
        vkCloudLoad(),
        new Promise(r=>setTimeout(()=>r(null), 1500))
      ]);
      if(cloud){
        save = normalize({...save, ...cloud, settings: save.settings});
        writeLocal();
      }
    }catch(e){ console.warn('[Boot] cloud load failed', e); }
  }

  // Теперь показываем UI уже с актуальным прогрессом.
  if(!save.welcomeShown){
    welcomeScreen();
    $('app').hidden=true;
    $('boot').hidden=true;
  } else {
    menu();
    $('app').hidden=false;
    $('boot').hidden=true;
  }
  Stats.track('session_start');
  clearTimeout(failsafe);
  setCloudStatus(vkReady ? t('cloudCloud') : t('cloudSDK'));
  if(!vkReady){ document.body.classList.add('no-rewarded-ads'); }
  preloadRewarded();
  if(save.settings.music && musicCurrentIdx < 0){
    const pref = save.settings.musicTrack;
    const regularIdxs = MUSIC_TRACKS.map((t,i)=>i).filter(i=>!MUSIC_TRACKS[i].boss);
    if(pref === 'random' || pref == null){
      musicStart(pickNextTrack());
    } else {
      const p = Number(pref);
      if(Number.isFinite(p) && regularIdxs.includes(p)) musicStart(p);
      else musicStart(pickNextTrack());
    }
  }

  if(vkReady&&window.vkBridge){
    try{
      vkBridge.subscribe(e=>{
        const type=e?.detail?.type;
        if(type==='VKWebAppViewHide')platformPause();
        if(type==='VKWebAppViewRestore')platformResume();
        if(type==='VKWebAppAudioPaused'){save.settings.sound=false;save.settings.music=false;syncAudio();}
        if(type==='VKWebAppAudioResumed'){save.settings.sound=true;save.settings.music=true;syncAudio();}
      });
    }catch{}
  }

  const hash=new URLSearchParams(location.hash.replace('#','?'));
  const inviteRoom=hash.get('duel');
  if(inviteRoom){
    duelConnect().then(()=>duelSend({type:'join_room',roomId:inviteRoom}));
  }

  if(vkReady&&window.vkBridge){
    try{await vkBridge.send('VKWebAppSetViewSettings',{status_bar_style:'dark',action_bar_color:'#ffffff'});}catch{}
  }
  if('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }
  console.warn('[Boot] Antivirus v2 loaded. Backups: stage7. Features: ad manager, cooldowns, timers.');
}

function showStorySequence(key,onDone){
  const cards=STORY[key];
  if(!cards||!cards.length){if(onDone)onDone();return;}
  let idx=0;
  function renderCard(){
    const c=cards[idx],last=idx===cards.length-1;
    const svg=c.npc==='leu'?getLeukocyteSVG(c.state||'idle'):getNikaSVG(c.state||'happy');
    const fact=c.fact?`<div class="story-fact"><b> Знаешь ли ты?</b><br>${c.fact}</div>`:'';
    show(`<div class="story-card"><div class="illustration">${svg}</div><h2>${c.title||''}</h2><div class="story-text">${c.text||''}</div>${fact}<div class="story-progress">${idx+1} / ${cards.length}</div><div class="stack"><button data-story="next" class="primary">${last?'✓ Продолжить':'Далее →'}</button></div>${!last?'<button class="story-skip" data-story="skip">Пропустить</button>':''}</div>`,'story');
    const dlg=$('dialog'),next=dlg.querySelector('[data-story="next"]'),skip=dlg.querySelector('[data-story="skip"]');
    if(next)next.onclick=()=>{if(last){if(onDone)onDone();}else{idx++;renderCard();}};
    if(skip)skip.onclick=()=>{if(onDone)onDone();};
  }
  renderCard();
}
